/* ---------- Cloudflare mode: own backend (D1 + R2), real accounts ---------- */
async function cfApi(method,url,body,raw){
  const r=await fetch(url,{method,credentials:"same-origin",headers:raw?{"content-type":raw.type||"application/octet-stream"}:body?{"content-type":"application/json"}:{},body:raw||(body?JSON.stringify(body):undefined)});
  let d=null;try{d=await r.json();}catch(e){}
  if(r.status===401){S.me=null;throw {code:"unauthenticated",message:(d&&d.error)||"Please sign in."};}
  if(r.status===403)throw {code:"invalid_argument",message:(d&&d.error)||"Not allowed."};
  if(!r.ok)throw {code:r.status===409?"conflict":"unavailable",message:(d&&d.error)||"Something went wrong."};
  return d;
}
function makeCfDb(){
  const subs={};let pulling=null;
  async function pull(){
    if(pulling)return pulling;
    pulling=(async()=>{try{const d=await cfApi("GET","/api/data");S.memberships=d.memberships||[];
      for(const col in subs){const rows=(d.docs&&d.docs[col])||[];subs[col].forEach(cb=>cb(rows));}}
      catch(e){if(e.code==="unauthenticated"){render();}} finally{pulling=null;}})();
    return pulling;
  }
  const path=(c,i)=>`/api/docs/${encodeURIComponent(c)}/${encodeURIComponent(i)}`;
  const docRef=(col,id)=>({id,path:col+"/"+id,
    set:async data=>{await cfApi("PUT",path(col,id),data);pull();},
    update:async data=>{await cfApi("PATCH",path(col,id),data);pull();},
    delete:async()=>{await cfApi("DELETE",path(col,id));pull();}});
  const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,24);
  const coll=col=>({path:col,doc:id=>docRef(col,id||newId()),
    add:async data=>{const r=docRef(col,newId());await r.set(data);return r;},
    orderBy(){return this;},limit(){return this;},where(){return this;},
    onSnapshot(next){(subs[col]=subs[col]||[]).push(rows=>next({docs:rows.map(x=>({id:x.id,exists:true,data:()=>x.data})),size:rows.length,empty:!rows.length,metadata:{fromCache:false,hasPendingWrites:false}}));return ()=>{};}});
  return {collection:coll,doc:p=>{const [c,i]=p.split("/");return docRef(c,i);},pull};
}
const cfAssets={async upload(file){const d=await cfApi("POST","/api/upload?pid="+encodeURIComponent(S.pid||""),null,file);return d;}};
const cfDownloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:"saved"};}};
const roleFor=pid=>((S.memberships||[]).find(m=>m.pid===pid)||{}).role||null;
async function cfAfterAuth(){
  const code=S.pendingInvite;
  if(code){try{const r=await cfApi("POST","/api/invites/accept",{code});S.pendingInvite=null;try{sessionStorage.removeItem("st.invite")}catch(e){}S.pid=r.pid;ls.set("st.pid",r.pid);toast("You've joined the project.");}catch(e){toast(e.message||"That invite link isn't valid any more.");S.pendingInvite=null;}}
  await S.db.pull();pickProject();
  const role=S.pid?roleFor(S.pid):null;
  go(role||"developer");
}
function cfAuthView(){
  const inv=S.pendingInvite,mode=S.authMode||"in";
  return `<div class="auth"><div class="auth-box">
    <a class="brand" href="#home"><span class="mark" aria-hidden="true"></span>TrailConstruct</a>
    ${inv?`<p class="note">You've been invited to a project. ${mode==="in"?"Sign in":"Create your account"} to join it.</p>`:""}
    <div class="seg" role="group" aria-label="Sign in or create account"><label><input type="radio" name="am" value="in" data-act="authmode" ${mode==="in"?"checked":""}><span>Sign in</span></label><label><input type="radio" name="am" value="up" data-act="authmode" ${mode==="up"?"checked":""}><span>Create account</span></label></div>
    <form id="auth-form">
      ${mode==="up"?`<label class="f" for="au-name">Full name<input type="text" id="au-name" required autocomplete="name"></label>`:""}
      <label class="f" for="au-email">Email<input type="email" id="au-email" required autocomplete="email"></label>
      <label class="f" for="au-pass">Password<input type="password" id="au-pass" required minlength="8" autocomplete="${mode==="up"?"new-password":"current-password"}"></label>
      <div><button class="btn pri" type="submit" ${S.busy?"disabled":""}>${S.busy?"Please wait…":mode==="up"?"Create account":"Sign in"}</button></div>
    </form>
    ${!inv?`<p class="small" style="text-align:center">Developer setting up a site? <a class="link" href="#signup">Start here</a></p>`:""}
    <a class="link small" href="#home">Back to home</a>
  </div></div>`;
}
function teamSection(p){
  const t=S.team[p.id];
  if(!t){cfApi("GET","/api/members?pid="+encodeURIComponent(p.id)).then(d=>{S.team[p.id]=d;render();}).catch(()=>{});return `<section class="card"><h2>Team</h2><div class="empty">Loading team…</div></section>`;}
  const link=c=>location.origin+"/?invite="+c;
  return `<section class="card"><h2>Team</h2>
    <div>${(t.members||[]).map(m=>`<div class="exp"><span>${esc(m.name||m.email)}</span><span class="pill ${m.role==="investor"?"ok":m.role==="engineer"?"active":""}">${ROLE_LABEL[m.role]||m.role}</span><span class="small muted">${esc(m.email)}</span><span></span></div>`).join("")}</div>
    ${(t.invites||[]).length?`<h3>Pending invites</h3>${t.invites.map(i=>`<div class="exp"><span>${esc(i.name||i.email||"Invite")} · ${ROLE_LABEL[i.role]}</span><span class="actions">${waLink(`You've been invited to follow ${p.name} on TrailConstruct as ${ROLE_LABEL[i.role]}. Join here: ${link(i.code)}`,"Send")}<button class="btn sm" data-act="copy" data-text="${esc(link(i.code))}">Copy link</button></span><span class="small muted">${esc(i.email||"")}</span><span></span></div>`).join("")}`:""}
    <form id="inv-form"><h3>Invite someone</h3><div class="row"><label class="f" for="iv-name">Name<input type="text" id="iv-name" required></label><label class="f" for="iv-email">Email<input type="email" id="iv-email"></label><label class="f" for="iv-role">Role<select id="iv-role"><option value="engineer">Site engineer</option><option value="investor">Investor</option><option value="developer">Developer (full access)</option></select></label></div><div><button class="btn pri" type="submit">Create invite link</button></div></form>
  </section>`;
}
async function getDevicePos(){
  if(!navigator.geolocation)return null;
  return new Promise(res=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:60000}));
}
async function initCf(){
  let me;
  try{me=await fetch("/api/me",{credentials:"same-origin"});}catch(e){return false;}
  if(!me||(me.status!==200&&me.status!==401)||!(me.headers.get("content-type")||"").includes("json"))return false;
  S.mode="cf";S.db=makeCfDb();S.assets=cfAssets;S.downloads=cfDownloads;S.team={};S.canWrite=true;
  const q=new URLSearchParams(location.search).get("invite");
  if(q){S.pendingInvite=q;try{sessionStorage.setItem("st.invite",q)}catch(e){}history.replaceState(null,"",location.pathname+"#signin");S.view="signin";S.authMode="up";}
  else{try{S.pendingInvite=sessionStorage.getItem("st.invite")||null}catch(e){}}
  ["projects","logs","reports","updates","expenses","requests","matreqs","stock","milestones"].forEach(c=>subscribe(c,S.db.collection(c)));
  if(me.status===200){const d=await me.json();S.me=d.user;S.memberships=d.memberships||[];await S.db.pull();if(S.pendingInvite){await cfAfterAuth();return true;}}
  else{S.me=null;S.loaded.projects=true;}
  setInterval(()=>{if(S.me&&document.visibilityState==="visible")S.db.pull();},20000);
  document.addEventListener("visibilitychange",()=>{if(S.me&&document.visibilityState==="visible")S.db.pull();});
  setTimeout(flushOutbox,2500);
  render();return true;
}


/* ---------- start ---------- */
(function(){const h=location.hash.slice(1);if(["home","signin","signup","demo","developer","engineer","investor"].includes(h))S.view=h;})();
render();
(async function init(){
  const C=window.claude;
  if(!C||typeof C.use!=="function"){if(await initCf())return;previewSeed();S.mode="memory";pickProject();render();return;}
  let db=null;try{db=await C.use("db");}catch(e){}
  try{S.downloads=await C.use("downloads");}catch(e){}
  if(!db){previewSeed();S.mode="memory";pickProject();render();return;}
  S.db=db;S.mode="db";
  try{const u=await C.use("user");if(u&&typeof u.can==="function"){const c=await u.can("data.write");if(c===false)S.canWrite=false;}}catch(e){}
  try{S.assets=await C.use("assets");}catch(e){}
  const timer=setTimeout(()=>{if(!S.loaded.projects){S.slow=true;render();}},10000);
  subscribe("projects",db.collection("projects"));
  subscribe("logs",db.collection("logs").orderBy("createdAt","desc").limit(500));
  subscribe("reports",db.collection("reports"));
  subscribe("updates",db.collection("updates"));
  subscribe("expenses",db.collection("expenses"));
  subscribe("requests",db.collection("requests"));
  subscribe("matreqs",db.collection("matreqs"));
  subscribe("stock",db.collection("stock"));
  subscribe("milestones",db.collection("milestones"));
  setTimeout(flushOutbox,2500);
  const chk=setInterval(()=>{if(S.loaded.projects){S.slow=false;clearTimeout(timer);clearInterval(chk);render();}},300);
})();
})();
