<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrailConstruct</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%231D3546'/%3E%3Cg transform='translate(0 10)'%3E%3Crect x='8' y='10' width='50' height='15' fill='%23fff'/%3E%3Crect x='25' y='10' width='16' height='72' fill='%23fff'/%3E%3Cpath d='M103.2 24.8A30 30 0 1 0 103.2 67.2' fill='none' stroke='%23fff' stroke-width='16'/%3E%3Cpolyline points='6,88 38,72 68,77 108,52' fill='none' stroke='%23F0A500' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='38' cy='72' r='6' fill='%23F0A500'/%3E%3Ccircle cx='68' cy='77' r='6' fill='%23F0A500'/%3E%3Ccircle cx='108' cy='52' r='8' fill='%23F0A500'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1D3546">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: marketing home → sign-in → one focused workspace per role, tabbed. Concrete neutrals, steel-blue actions, hi-vis amber for attention. */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --sunk:#f6f7f3; --ink:#15202a; --muted:#5b6570; --line:#dfe2db;
  --steel:#2b4a5e; --steel-ink:#ffffff; --amber:#f0a500; --amber-soft:#fdf1d2; --amber-ink:#c98f00;
  --ok:#2c7a4b; --ok-soft:#e2f1e7; --warn:#99600a; --crit:#b8382b; --crit-soft:#f8e3e0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161a; --surface:#1a2127; --sunk:#151b20; --ink:#e6eae4; --muted:#98a2aa; --line:#2b343c;
    --steel:#86b0c8; --steel-ink:#0f1a22; --amber:#f2b42e; --amber-soft:#3a2f14; --amber-ink:#f2b42e;
    --ok:#5cc184; --ok-soft:#173022; --warn:#e0a640; --crit:#ef7466; --crit-soft:#3b1d1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161a; --surface:#1a2127; --sunk:#151b20; --ink:#e6eae4; --muted:#98a2aa; --line:#2b343c;
  --steel:#86b0c8; --steel-ink:#0f1a22; --amber:#f2b42e; --amber-soft:#3a2f14; --amber-ink:#f2b42e;
  --ok:#5cc184; --ok-soft:#173022; --warn:#e0a640; --crit:#ef7466; --crit-soft:#3b1d1a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
.sr{position:absolute;left:-9999px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1b1404}
.btn.sm{padding:6px 11px;font-size:.86rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.legal{max-width:760px;margin:0 auto;padding:32px 20px 64px;line-height:1.6}.legal h1{font-family:var(--display);font-size:2.6rem;margin:16px 0 4px}.legal h2{font-family:var(--display);font-size:1.5rem;margin:28px 0 6px}.legal li{margin:4px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--steel);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.mark{width:36px;height:30px;flex:none;display:block;color:currentColor}.mark .tr{stroke:var(--amber)}.mark .dt{fill:var(--amber)}
.wm2{color:var(--amber-ink,#c98f00)}.apphead .wm2,.band .wm2,.demo-head .wm2,.dark-brand .wm2{color:var(--amber)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.45rem;font-weight:700;color:var(--ink);text-decoration:none}

/* ---------- home ---------- */
.nav{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:16px;padding-bottom:16px;position:relative;z-index:2;display:flex;align-items:center;gap:16px}
.nav .sp{flex:1}
.nav a.nl{color:var(--muted);text-decoration:none;font-weight:500}
@media (max-width:560px){.nav a.nl{display:none}}
.hero{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:28px;padding-bottom:56px;position:relative;z-index:2;display:grid;gap:32px;align-items:center}
@media (min-width:900px){.hero{grid-template-columns:1.1fr .9fr;padding-top:56px;gap:56px}}
.hero h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--amber) 62%)}
.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-top:14px}
.hero .actions{margin-top:22px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;box-shadow:0 18px 40px -24px rgba(21,32,42,.35)}
.demo-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:56px;padding-bottom:56px;position:relative;display:grid;gap:22px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.roles3{display:grid;gap:14px}
@media (min-width:800px){.roles3{grid-template-columns:repeat(3,1fr)}}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;align-content:start}
.rcard .tag{display:inline-block;font-family:var(--display);font-size:1.6rem;font-weight:700}
.rcard ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rcard .bar-top{height:5px;border-radius:9px;background:var(--steel);width:42px}
.rcard:nth-child(2) .bar-top{background:var(--amber)}
.rcard:nth-child(3) .bar-top{background:var(--ok)}
.flow{display:grid;gap:12px;counter-reset:f}
@media (min-width:800px){.flow{grid-template-columns:repeat(3,1fr)}}
.flow li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px}
.flow li b{font-family:var(--display);font-size:1.25rem}
.flow li::before{counter-increment:f;content:"Step " counter(f);font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.flow{padding:0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.price{background:var(--steel);color:var(--steel-ink);border-radius:16px;padding:26px;display:grid;gap:12px}
@media (min-width:800px){.price{grid-template-columns:1fr auto;align-items:center}}
.price .big{font-family:var(--display);font-size:3rem;line-height:1}
.price .btn{background:var(--amber);border-color:var(--amber);color:#1b1404}
.hfoot{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:24px;padding-bottom:48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.86rem;border-top:1px solid var(--line)}

/* ---------- sign in ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.auth-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:440px;display:grid;gap:16px}
.pw{position:relative;display:block}.pw input{padding-right:46px}.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer;display:grid;place-items:center}.pw-eye:hover{color:var(--ink)}.pw-eye:focus-visible{outline:2px solid var(--amber)}
.actlog{list-style:none;margin:0;padding:0;display:grid}.actlog li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}.actlog li:first-child{border-top:0}@media (max-width:520px){.actlog li{grid-template-columns:1fr;gap:2px}}
.paybox{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:6px}.paybox .row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.paybox .tot{border-top:1px solid var(--line);padding-top:8px}.paybox .big{font-size:1.35rem}
.bankbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}.bankbox>div{display:grid;gap:2px}.bankbox .cp{display:flex;justify-content:space-between;align-items:center;gap:10px}.bankbox .cp>div{display:grid;gap:2px}.big2{font-size:1.1rem;letter-spacing:.04em}
.tblwrap{overflow-x:auto}.adm{width:100%;border-collapse:collapse;font-size:.92rem}.adm th,.adm td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}.adm th{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:700px){.adm thead{display:none}.adm tr{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}.adm td{border:0;padding:0}.adm td:empty{display:none}.adm td[data-l]::before{content:attr(data-l) ": ";color:var(--muted)}}
.annc{background:var(--amber);color:#1b1404;text-align:center;font-weight:600;padding:9px 16px;font-size:.92rem}
.adm-pick{display:none;padding:0 16px 12px}.adm-pick select{width:100%;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:11px 12px;font-weight:600;font-size:1rem;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}.adm-pick option{color:#15202a}
@media (max-width:700px){.apphead .tabs.adm-tabs,.apphead .tabs.many{display:none}.apphead .adm-pick{display:block}}
.card>*,.card form>*{min-width:0}.upl input[type=file]{max-width:100%;min-width:0;width:100%}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:6px}.pager .btn[disabled]{opacity:.45;cursor:default}
.adm-main{max-width:1180px}.adm-stats{grid-template-columns:repeat(2,minmax(0,1fr))}@media (min-width:760px){.adm-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}.stat b{font-size:1.5rem}main .stats.adm-stats>.stat.stat:nth-child(n){background:var(--sunk)}main .stats.adm-stats>.stat.stat.ok:nth-child(n){background:var(--ok-soft)}main .stats.adm-stats>.stat.stat.warn:nth-child(n){background:var(--amber-soft)}main .stats.adm-stats>.stat.stat.crit:nth-child(n){background:var(--crit-soft)}
.lead{border-top:1px solid var(--line);padding:10px 0}.lead:first-of-type{border-top:0}.chk{display:flex;gap:8px;align-items:center;font-size:.92rem}
.corr{border-left:3px solid var(--amber);padding-left:8px}.crq{border-top:1px solid var(--line);padding:10px 0}.crq:first-of-type{border-top:0}
.mixbox{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}.mixrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:end}@media (max-width:520px){.mixrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mixrow label:first-child{grid-column:1/-1}}
[hidden]{display:none!important}
.auth-h{font-family:var(--display);font-size:1.6rem;margin:0}
.pick{display:grid;gap:10px}
.pick button{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);cursor:pointer}
.pick button:hover{border-color:var(--steel)}
.pick .ic{grid-row:span 2;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;background:var(--steel);color:var(--steel-ink)}
.pick b{font-size:1rem}
.note{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:10px;padding:10px 12px;font-size:.86rem}

/* ---------- app shell ---------- */
.apphead{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.apphead-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.apphead .sp{flex:1}
.who{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.proj{max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-weight:600}
.tabs{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--amber);color:#1b1404;font-size:.72rem;line-height:18px;text-align:center}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main.narrow{max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:800px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}

.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.active{background:var(--amber-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}

.bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--steel);border-radius:99px}
.bar.over>i{background:var(--crit)}

/* phases strip */
.phases{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.phases i{height:10px;border-radius:3px;background:var(--line)}
.phases i.done{background:var(--ok)}
.phases i.active{background:var(--amber)}
.ph-cap{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.45rem;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:.8rem;color:var(--muted)}

.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--sunk);border-left:4px solid var(--amber);flex-wrap:wrap}
.todo li.ok{border-left-color:var(--ok)}
.todo li.crit{border-left-color:var(--crit)}

.banner{border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.due{background:var(--amber-soft);border:1px solid var(--amber)}
.banner.late{background:var(--crit-soft);border:1px solid var(--crit)}
.banner.done{background:var(--ok-soft)}
.banner strong{font-family:var(--display);font-size:1.3rem;display:block}

/* stages */
.stages{display:grid;gap:6px}
.grp{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:10px}
.stage{border:1px solid var(--line);border-radius:10px}
.stage.active{border-left:4px solid var(--amber)}
.stage.done{border-left:4px solid var(--ok)}
.stage-h{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border:0;background:none;padding:10px 12px;text-align:left;cursor:pointer}
.stage-h .bar{grid-column:1/-1}
.checks{list-style:none;margin:0;padding:0 12px 12px;display:grid;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.checks label:hover{background:var(--sunk)}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--steel);flex:none}
.done-t{color:var(--muted);text-decoration:line-through}

/* logs & reports */
.list{display:grid;gap:0}
.log{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.log:first-child{border-top:0;padding-top:0}
.log-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.issue{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:6px 10px;font-size:.9rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.photos.lg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ph{position:relative;border:0;padding:0;background:var(--sunk);border-radius:9px;overflow:hidden;aspect-ratio:1;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sel{cursor:pointer;outline:0}
.ph.sel[aria-pressed="true"]{box-shadow:0 0 0 3px var(--amber)}
.ph .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.ph.sel[aria-pressed="true"] .tick{background:var(--amber);color:#1b1404;border-color:var(--amber)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:.7rem;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;text-align:left}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.rep ul{margin:0;padding-left:18px}

/* forms */
form{display:grid;gap:12px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.f{display:grid;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=tel],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);font-weight:400}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--steel)}
.upl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--sunk)}
.upl input{max-width:100%}

/* investor */
.ihero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:460px){.ihero{grid-template-columns:1fr;justify-items:start}.ihero>div{width:100%}}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}

@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}

/* ---------- colour & life ---------- */
:root{--deep:#1d3546;--sky:#e4eef5;--sky-ink:#24526e;--mint:#e2f1e7;--sand:#fdf1d2;--rose:#f9e6e1;--rose-ink:#9b3b26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--deep:#0e1e29;--sky:#18303f;--sky-ink:#9fcbe6;--mint:#173022;--sand:#3a2f14;--rose:#3a221c;--rose-ink:#f0a08c}}
:root[data-theme="dark"]{--deep:#0e1e29;--sky:#18303f;--sky-ink:#9fcbe6;--mint:#173022;--sand:#3a2f14;--rose:#3a221c;--rose-ink:#f0a08c}
.band{background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(1200px 500px at 85% -10%,#2f5a74 0,transparent 60%),var(--deep);color:#fff;padding-bottom:28px}
.band .brand{color:#fff}
.band .nav a.nl{color:rgba(255,255,255,.75)}
.band .lead{color:rgba(255,255,255,.78)}
.band .hero h1 em{background:linear-gradient(transparent 62%,var(--amber) 62%);color:#fff}
.kicker{display:inline-block;margin-bottom:14px;padding:4px 10px;border-radius:999px;background:rgba(240,165,0,.16);color:#ffd36b;font-size:.82rem;font-weight:600}
.btn.outline{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.outline:hover{border-color:#fff}
.band .demo{color:var(--ink)}
.sh{font-size:2rem;margin-top:6px}
.rcard{position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px}
.rcard.r1::before{background:var(--steel)} .rcard.r2::before{background:var(--amber)} .rcard.r3::before{background:var(--ok)}
.ricon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.r1 .ricon{background:var(--sky);color:var(--sky-ink)} .r2 .ricon{background:var(--sand);color:var(--warn)} .r3 .ricon{background:var(--mint);color:var(--ok)}
.flow li{border-top:5px solid var(--line)}
.flow li.f1{border-top-color:var(--steel)} .flow li.f2{border-top-color:var(--amber)} .flow li.f3{border-top-color:var(--ok)}
.chip.c0{background:var(--sky);color:var(--sky-ink);border-color:transparent} .chip.c1{background:var(--sand);color:var(--warn);border-color:transparent}
.chip.c2{background:var(--mint);color:var(--ok);border-color:transparent} .chip.c3{background:var(--rose);color:var(--rose-ink);border-color:transparent}
.price{background:linear-gradient(135deg,var(--deep),#2b4a5e);color:#fff}

/* app header in brand colour */
.apphead{background:var(--deep);border-bottom:0;color:#fff}
.apphead .brand{color:#fff}
.apphead .who{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.apphead .btn.ghost{color:#fff}
.apphead .proj{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.apphead .proj option{color:#15202a}
.tabs button{color:rgba(255,255,255,.65)}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--amber)}

/* tinted stats */
.stat.t1{background:var(--sky)} .stat.t1 b{color:var(--sky-ink)}
.stat.t2{background:var(--sand)} .stat.t2 b{color:var(--warn)}
.stat.t3{background:var(--mint)} .stat.t3 b{color:var(--ok)}
.stat.t4{background:var(--rose)} .stat.t4 b{color:var(--rose-ink)}
main .stats>.stat:nth-child(1):not([class*=" t"]){background:var(--sky)}
main .stats>.stat:nth-child(2):not([class*=" t"]){background:var(--sand)}
main .stats>.stat:nth-child(3):not([class*=" t"]){background:var(--mint)}
main .stats>.stat:nth-child(4):not([class*=" t"]){background:var(--rose)}

/* investor cover */
.cover{border-radius:16px;min-height:200px;display:grid;align-items:end;overflow:hidden;color:#fff;
  background:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(135deg,var(--deep),#2f5a74)}
.cover.has{min-height:240px;background:linear-gradient(180deg,rgba(10,18,26,.05) 20%,rgba(10,18,26,.82)),var(--img) center/cover no-repeat,var(--deep)}
.cover-in{padding:18px;display:grid;gap:6px;justify-items:start}
.cover h1{font-size:clamp(1.8rem,6vw,2.4rem)}
.cover p{opacity:.85}
.pill.glass,.btn.glass{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.btn.glass{margin-top:6px}
.sch{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:.9rem}
.bar.amberbar>i{background:var(--amber)}
.ms{list-style:none;margin:0;padding:0;display:grid}
.ms li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ms li:first-child{border-top:0}
.ms-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:#fff}
.ms .done .ms-dot{background:var(--ok);border-color:var(--ok)}
.ms .active .ms-dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px var(--sand)}
.ms .todo{color:var(--muted)}
.ms .active span:nth-child(2){font-weight:600}
.card.hl{border-left:5px solid var(--amber)}
.card.ask{background:linear-gradient(135deg,var(--sand),var(--surface));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner.due{background:linear-gradient(135deg,var(--sand),var(--surface))}

/* ---------- home v3 ---------- */
.band{position:relative;overflow:hidden}
.bp{position:absolute;right:-40px;bottom:-10px;width:min(820px,95vw);height:auto;color:rgba(160,205,235,.22);z-index:1;pointer-events:none}
@media (max-width:899px){.bp{opacity:.6;right:-120px}}
.bp .dr *{stroke-dasharray:1;stroke-dashoffset:0}
.bp .sway{transform-origin:600px 52px}
@media (prefers-reduced-motion:no-preference){
  .bp .dr *{animation:draw 2.8s ease-out both}
  .bp .dr:nth-of-type(2) *{animation-delay:.2s}.bp .dr:nth-of-type(3) *{animation-delay:.5s}
  .bp .tx{animation:fadein 1.2s 1.8s both}
  .bp .sway{animation:sway 5s ease-in-out infinite}
  .float{animation:float 6s ease-in-out infinite}
  .ring-anim .ring circle:nth-of-type(2){animation:ringin 1.6s .3s cubic-bezier(.2,.8,.2,1) both}
  .reveal.pop{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  #feed.in{animation:feedin .45s ease both}
  .dot-live{animation:pulse 1.6s infinite}
  .step-panel,.demo-stage,.phase-detail{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .stp[aria-selected="true"] .stp-bar>i{animation:fill 7s linear both}
  .btn{transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .btn:hover{transform:translateY(-1px)}
  .rcard,.plan-card,.pain{transition:transform .25s ease,box-shadow .25s ease}
  .rcard:hover,.plan-card:hover,.pain:hover{transform:translateY(-4px);box-shadow:0 18px 36px -24px rgba(21,32,42,.45)}
}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ringin{from{stroke-dasharray:0 400}}
@keyframes rise{from{transform:translateY(18px);opacity:.35}to{transform:none;opacity:1}}
@keyframes feedin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,122,75,.5)}70%{box-shadow:0 0 0 8px rgba(44,122,75,0)}100%{box-shadow:0 0 0 0 rgba(44,122,75,0)}}
@keyframes fill{from{width:0}to{width:100%}}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.8rem)}
.hero-note{margin-top:14px;font-size:.86rem;color:rgba(255,255,255,.6)}
.btn.lg{padding:13px 22px;font-size:1.02rem}
.play{font-size:.8em}
.demo{max-width:520px;justify-self:end;width:100%}
.demo-feed{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.86rem;overflow:hidden}

.strip{background:var(--surface);border-bottom:1px solid var(--line)}

.sec-h{display:grid;gap:6px;max-width:760px}

.sh{font-size:clamp(1.8rem,3.6vw,2.6rem)}

@media (min-width:800px){.pains{grid-template-columns:repeat(3,1fr)}}
.pain{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:10px;align-content:start}
.pain b{font-family:var(--display);font-size:1.35rem}
.pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.4rem}
.pi.p1{background:var(--sky);color:var(--sky-ink)}.pi.p2{background:var(--sand);color:var(--warn)}.pi.p3{background:var(--mint);color:var(--ok)}
.roles3{gap:18px}
.rcard{padding:24px}

@media (min-width:800px){.steps{grid-template-columns:repeat(3,1fr)}}
.stp{position:relative;display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;overflow:hidden}
.stp small{display:block;color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}

.stp.s1[aria-selected="true"]{background:var(--sky)}.stp.s2[aria-selected="true"]{background:var(--sand)}.stp.s3[aria-selected="true"]{background:var(--mint)}
.stp.s1 .stp-n{color:var(--sky-ink)}.stp.s2 .stp-n{color:var(--warn)}.stp.s3 .stp-n{color:var(--ok)}

.stp-bar>i{display:block;height:100%;width:0;background:var(--ink);opacity:.35}

.lead2{font-size:1.15rem;line-height:1.5}
.ticks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ticks li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}

.sp-mock{display:grid;place-items:center;padding:18px;border-radius:16px;background:linear-gradient(rgba(43,74,94,.06) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(43,74,94,.06) 1px,transparent 1px) 0 0/18px 18px,var(--sunk)}
/* mockups */
.mk{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:0 20px 40px -26px rgba(21,32,42,.55);font-size:.86rem}

.demo-body{position:relative;z-index:2;max-width:1320px;width:100%;margin:0 auto;padding:16px clamp(16px,4vw,56px) 24px;display:grid;gap:32px;align-items:start;align-content:center}

.who-tag{padding:4px 12px;border-radius:999px;font-weight:700;font-size:.8rem}
.who-tag.s1{background:var(--sky);color:var(--sky-ink)}.who-tag.s2{background:var(--amber);color:#1b1404}.who-tag.s3{background:var(--mint);color:var(--ok)}
.demo-stage{display:grid;place-items:center;padding:24px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--ink);min-height:360px}

.demo-dots button.s1[aria-current="step"] i{background:#7fb6dc}.demo-dots button.s2[aria-current="step"] i{background:var(--amber)}.demo-dots button.s3[aria-current="step"] i{background:#5cc184}

.cam{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--sunk);border:1px dashed var(--line)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
/* Milestone payments are on hold until an escrow partner is connected. */
const PAY_SOON=true;
const payOn=p=>!PAY_SOON&&!!p&&p.payMode==="milestone";
const S={db:null,assets:null,downloads:null,mode:"loading",canWrite:true,projects:[],logs:[],reports:[],updates:[],expenses:[],requests:[],matreqs:[],stock:[],milestones:[],
  pid:null,view:"home",shots:[],manualGps:{},mapsKey:"",tab:{developer:"overview",engineer:"today",investor:"overview"},open:{},loaded:{},slow:false,busy:false,
  demo:{i:0,play:false},seen:new Set(),counted:new Set(),home:{qs:1,qp:5,step:0,projects:1,annual:false,phase:7,auto:true},onb:{step:0,d:{floors:2,phase:0,team:[],annual:false}},draft:{sel:[],extra:[],title:"",briefing:"",next:"",budget:false,fromReport:null}};
const ROLE_LABEL={developer:"Developer",engineer:"Site Engineer",investor:"Investor"};

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const naira=n=>"₦"+Math.round(+n||0).toLocaleString("en-NG");
const nairaS=n=>{n=+n||0;const f=(x,s)=>"₦"+(Math.round(x*10)/10).toLocaleString("en-NG")+s;return n>=1e9?f(n/1e9,"bn"):n>=1e6?f(n/1e6,"m"):naira(n);};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}const d=new Date(s);return isNaN(d)?null:d;};
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";};
const fmtS=s=>{const d=parseD(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";};
const ordinal=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
const levelName=k=>k===0?"Ground floor":ordinal(k)+" floor";
function weekOf(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));const fri=new Date(d);fri.setDate(d.getDate()+4);fri.setHours(18,0,0,0);return {mon:d,fri,key:ymd(d)};}
function daysSince(s){const d=parseD(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);return Math.round((t-x)/864e5);}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const src=p=>p.url||("/_blob/"+p.id);

/* ---------- foundation types ---------- */
const FOUNDATIONS={
  strip:{label:"Strip foundation",short:"strip",cast:"Strip foundation concrete cast"},
  pad:{label:"Pad foundation (column footings)",short:"pad",cast:"Pad footings & ground beams cast"},
  raft:{label:"Raft foundation",short:"raft",cast:"Raft slab & edge beams cast"},
  pile:{label:"Pile foundation",short:"pile",cast:"Pile caps & ground beams cast"}
};
const foundationSelect=(id,val,attr)=>`<label class="f" for="${id}">Foundation type<select id="${id}" ${attr}><option value="">Not decided yet (soil test pending)</option>${Object.entries(FOUNDATIONS).map(([k,s])=>`<option value="${k}" ${val===k?"selected":""}>${s.label}</option>`).join("")}</select></label>`;

/* ---------- approvals & outstanding items ---------- */
const APPROVAL_IDS=new Set(["pre.3","pre.4","set.3","fdn.9","roof.6","hnd.3"]);
function outstanding(p){
  const pr=progress(p),c=p.checks||{};let far=-1;
  pr.stages.forEach((s,i)=>{if(s.done>0)far=i;});
  const out=[];pr.stages.forEach((s,i)=>{if(i<far)s.items.forEach(it=>{if(!c[it.id])out.push({stage:s,item:it,approval:APPROVAL_IDS.has(it.id)});});});
  out.sort((a,b)=>(b.approval?1:0)-(a.approval?1:0));
  return out;
}
function outstandingCard(p,limit){
  const o=outstanding(p);if(!o.length)return "";
  const ap=o.filter(x=>x.approval).length,show=o.slice(0,limit||8);
  return `<section class="card outcard"><div class="card-h"><h3>Still outstanding from earlier stages</h3><span class="pill crit">${o.length}</span></div>
  <p class="small muted">Work has moved on, but these haven't been ticked off yet.${ap?` ${ap} ${ap===1?"is an approval":"are approvals"}.`:""} You can keep building; we'll keep reminding you until they're done.</p>
  <ul class="outlist">${show.map(x=>`<li><span>${esc(x.item.label)}</span><span class="small muted">${esc(x.stage.name)}</span>${x.approval?`<span class="pill active">Approval pending</span>`:"<span></span>"}</li>`).join("")}</ul>
  ${o.length>show.length?`<p class="small muted">+ ${o.length-show.length} more in the Stages tab.</p>`:""}</section>`;
}

/* ---------- sewage systems ---------- */
const SEWAGE={
  septic:{label:"Septic tank + soakaway (traditional)",short:"septic tank + soakaway",items:[["s0","Excavation for septic tank & soakaway"],["s1","Septic tank built & rendered (blockwork / reinforced)"],["s2","Septic tank cover slab cast"],["s3","Soakaway pit constructed"],["s4","Inspection chambers / manholes"],["s5","Connected to building soil & waste pipes"],["s6","Tested for leaks & flow"]]},
  biodigester:{label:"Bio-digester",short:"bio-digester",items:[["b0","Excavation for bio-digester & outlet"],["b1","Bio-digester installed & levelled"],["b2","Soakaway / outlet constructed"],["b3","Inspection chambers / manholes"],["b4","Connected to building soil & waste pipes"],["b5","Tested & commissioned"]]},
  sewer:{label:"Connection to central / estate sewer",short:"central sewer",items:[["c0","Inspection chambers / manholes"],["c1","Pipe run to sewer connection point"],["c2","Connected to central / estate sewer"],["c3","Connection inspected & approved"]]}
};
const sewageSelect=(id,val,attr)=>`<label class="f" for="${id}">Sewage system<select id="${id}" ${attr}>${Object.entries(SEWAGE).map(([k,s])=>`<option value="${k}" ${(val||"septic")===k?"selected":""}>${s.label}</option>`).join("")}</select></label>`;

/* ---------- Nigerian construction stage template ---------- */
function stagesFor(p){
  const floors=Math.max(0,Math.min(30,parseInt(p.floors,10)||0)),st=[];
  const add=(id,group,name,weight,items)=>st.push({id,group,name,weight,items:items.map((l,i)=>Array.isArray(l)?{id:id+"."+l[0],label:l[1]}:{id:id+"."+i,label:l})});
  add("pre","Pre-construction","Site inspection, surveys & approvals",4,["Site inspection & title/survey plan checked","Topographic survey","Soil investigation (geotechnical test)","Architectural, structural & M&E drawings approved","Building permit obtained (LASPPPA)","Site clearing & hoarding","Site office, store & water source set up","Mobilisation of workers & equipment"]);
  add("set","Setting out","Setting out",2,["Profile boards erected","Building lines & grid pegged to drawings","Diagonals and levels checked","Setting-out approved by engineer / LASBCA stage inspection"]);
  {const ft=FOUNDATIONS[p.foundationType]?p.foundationType:"";const pile=ft==="pile";
  add("fdn","Foundation",ft?"Foundation & substructure ("+FOUNDATIONS[ft].short+")":"Foundation & substructure",pile?15:12,[
    ...(pile?[["p0","Piling contractor & rig mobilised"],["p1","Pile positions set out & checked"],["p2","Test piles installed & load / integrity tested"],["p3","Working piles bored / driven & concreted"],["p4","Pile heads cut down & cropped to level"]]:[]),
    ["0",pile?"Excavation for pile caps & ground beams":"Excavation of trenches / pits to depth"],["1","Blinding (lean concrete)"],["2","Foundation reinforcement fixed & inspected"],
    ["3",ft?FOUNDATIONS[ft].cast:"Foundation concrete cast (strip / pad / raft / pile caps)"],
    ["4","Blockwork to DPC level (German floor)"],["5","Anti-termite treatment"],["6","Backfilling & compaction"],["7","Damp-proof membrane laid"],["8","Oversite concrete (ground floor slab)"],["9","Foundation stage certification"]]);}
  const lv=floors+1,w=30/lv;
  for(let k=0;k<lv;k++){const nm=levelName(k);
    if(k<floors)add("lv"+k,"Frame",nm+" walls & "+levelName(k+1)+" slab",w,["Columns reinforced & cast","Blockwork to lintel level","Lintels cast","Blockwork to beam level","Electrical & plumbing conduits laid before decking","Beam & slab formwork erected","Slab reinforcement inspected by engineer","Slab cast (decking) & curing","Formwork struck"]);
    else add("lv"+k,"Frame",(floors?nm+" walls":"Walls")+" to roof level",w,["Columns reinforced & cast","Blockwork to lintel level","Lintels cast","Blockwork to roof beam level","Roof / ring beam cast"]);}
  add("roof","Roofing","Roofing",8,["Wall plate fixed","Parapet / gable walls","Roof trusses & carcassing (treated timber or steel)","Fascia board fixed","Roof covering (long-span aluminium / stone-coated)","Gutters & downpipes","Roof stage inspection"]);
  add("me1","M&E first fix","M&E first fix (rough-in)",8,["Chasing for electrical conduits","Conduits & cable pulling","Plumbing supply pipes (hot & cold)","Waste & soil pipes","AC copper piping & drain lines",["6","Borehole, pumping & overhead tank stand"]]);
  add("pls","Plastering","Frames, plastering & screeding",8,["Door & window frames fixed","Internal plastering","External rendering","Floor screeding","Ceiling framing (POP / PVC)"]);
  add("fin","Finishes","Finishes, tiling & joinery",14,["Floor & wall tiling","Ceiling finish (POP / PVC)","Painting — undercoats","Doors hung & ironmongery","Windows glazed (aluminium / casement)","Kitchen cabinets & worktops","Wardrobes & built-in furniture","Staircase & balcony railings"]);
  add("me2","M&E second fix","M&E second fix & fittings",7,["Sockets, switches & light fittings","Distribution board & meter connection","Sanitary fittings (WC, basin, shower, sink)","Water heaters","Generator / inverter & changeover","Water treatment & pumps","Fire alarm & extinguishers","Testing & commissioning"]);
  const sw=SEWAGE[p.sewageType]?p.sewageType:"septic";
  add("sew","External works","Sewage disposal ("+SEWAGE[sw].short+")",3,SEWAGE[sw].items);
  add("ext","External works","External works",4,["Perimeter fence & gate","Gatehouse","Surface-water drains & compound drainage","Driveway & walkways (stamped concrete / interlocking paving)","Landscaping","External lighting"]);
  add("hnd","Handover","Snagging & handover",3,["Snag list compiled","Snags fixed","Final paint coat & cleaning","Certificate of Completion & Fitness for Habitation (LASBCA)","Handover, keys & manuals"]);
  return st;
}
function progress(p){
  const stages=stagesFor(p),c=p.checks||{};let tw=0,acc=0,current=null,next=null;
  stages.forEach(s=>{const d=s.items.filter(i=>c[i.id]).length;s.done=d;s.pct=d/s.items.length;s.status=s.pct>=1?"done":d>0?"active":"todo";tw+=s.weight;acc+=s.weight*s.pct;});
  let ci=-1;stages.forEach((s,i)=>{if(s.status==="active")ci=i;});if(ci<0)ci=stages.findIndex(s=>s.pct<1);current=ci>=0?stages[ci]:null;next=ci>=0?stages.slice(ci+1).find(s=>s.status==="todo")||stages.slice(ci+1).find(s=>s.pct<1)||null:null;
  const map=new Map();stages.forEach(s=>{if(!map.has(s.group))map.set(s.group,{name:s.group,w:0,a:0});const g=map.get(s.group);g.w+=s.weight;g.a+=s.weight*s.pct;});
  const phases=[...map.values()].map(g=>{const pct=g.a/g.w;return {name:g.name,pct,status:pct>=.999?"done":pct>0?"active":"todo"};});
  return {stages,overall:tw?acc/tw:0,current,next,phases};
}

/* ---------- data layer ---------- */
const queues={};
function queue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(onErr);return queues[key];}
function onErr(e){
  if(e&&e.code==="forbidden"){toast(e.message||"You can't change this.");render();return;}
  if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("You can view this project but not change it.");}
  else if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete old entries to add more.");
  else toast("That didn't save. Check your connection and try again.");
  render();
}
const store={
  async add(col,data){if(S.db){await S.db.collection(col).add(data);return;}S[col].push({id:"m"+Math.random().toString(36).slice(2),...data});render();},
  async set(col,id,data){if(S.db)return queue(col+"/"+id,()=>S.db.collection(col).doc(id).set(data));const i=S[col].findIndex(x=>x.id===id),r={id,...data};if(i<0)S[col].push(r);else S[col][i]=r;render();},
  async update(col,id,data){if(S.db)return queue(col+"/"+id,()=>S.db.collection(col).doc(id).update(data));const r=S[col].find(x=>x.id===id);if(!r)return;for(const k in data){if(data[k]&&typeof data[k]==="object"&&!Array.isArray(data[k]))r[k]={...(r[k]||{}),...data[k]};else r[k]=data[k];}render();},
  async del(col,id){if(S.db)return queue(col+"/"+id,()=>S.db.collection(col).doc(id).delete());S[col]=S[col].filter(x=>x.id!==id);render();}
};
async function uploadFile(file,pid,meta){
  if(S.assets){const r=await S.assets.upload(file,pid,meta);const out={id:r.id,url:r.url,takenAt:file.lastModified?new Date(file.lastModified).toISOString():null};if(r.checked)Object.assign(out,{v:r.v,dist:r.dist,uploadedAt:r.uploadedAt,late:!!r.late,checked:true});return out;}
  return {id:"local-"+Math.random().toString(36).slice(2),url:URL.createObjectURL(file)};
}
function subscribe(col,q){
  q.onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));if(!snap.metadata.fromCache)S.loaded[col]=true;pickProject();render();},
    err=>{S.loaded[col]=true;if(err&&err.code!=="revoked")toast("Couldn't load "+col+".");render();});
}

const logsOf=pid=>S.logs.filter(l=>l.pid===pid).sort(byDateDesc);

function weekStatus(pid){const w=weekOf(new Date()),r=reportsOf(pid).find(x=>x.weekStart===w.key),now=new Date();return {w,report:r,left:Math.ceil((w.fri-now)/864e5),late:!r&&now>w.fri};}

const bar=(pct,cls)=>`<div class="bar ${cls||""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct*100)}"><i style="width:${Math.max(0,Math.min(100,pct*100)).toFixed(1)}%"></i></div>`;
function ring(pct,size){size=size||132;const r=52,c=2*Math.PI*r,v=Math.max(0,Math.min(1,pct));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 128 128" role="img" aria-label="${Math.round(v*100)} percent complete"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--steel)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 64 64)"/><text x="64" y="72" text-anchor="middle" font-size="30">${Math.round(v*100)}%</text></svg>`;}
function phaseStrip(pr){let ci=-1;pr.phases.forEach((x,i)=>{if(x.status==="active")ci=i;});if(ci<0)ci=pr.phases.findIndex(x=>x.status!=="done");const cur=ci>=0?pr.phases[ci]:null;
  return `<div style="display:grid;gap:6px"><div class="phases" aria-hidden="true">${pr.phases.map(x=>`<i class="${x.status}" title="${esc(x.name)}"></i>`).join("")}</div>
  <div class="ph-cap"><span>${cur?`Phase ${ci+1} of ${pr.phases.length}: <b style="color:var(--ink)">${esc(cur.name)}</b>`:"All phases complete"}</span><span class="num">${Math.round(pr.overall*100)}% overall</span></div></div>`;}

function changesFor(pid){S.changes=S.changes||{};if(S.mode!=="cf"||!S.me)return [];const c=S.changes[pid];
  if(!c){S.changes[pid]={items:[],loading:true};cfApi("GET","/api/changes?pid="+encodeURIComponent(pid)).then(d=>{S.changes[pid]=d;render();}).catch(()=>{S.changes[pid]={items:[]};});return [];}
  return c.items||[];}

function crControls(p,col,r){

/* ---------- start date + duration -> target completion ---------- */
const DURS=[6,9,12,15,18,24,30,36,48];
function addMonths(ymdStr,n){const d=parseD(ymdStr);if(!d||!n)return "";const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+ +n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return ymd(t);}
function durNote(start,dur,target){
  if(dur==="custom")return target?`Completion: <b style="color:var(--ink)">${esc(fmtD(target))}</b>`:"Pick the completion date.";
  if(!dur)return "";
  if(!start)return "Pick a start date to work out the completion date.";
  return `Target completion: <b style="color:var(--ink)">${esc(fmtD(addMonths(start,dur)))}</b>`;
}
function durBlock(prefix,start,dur,target,attr){
  return `<div class="row"><label class="f" for="${prefix}-start">Start date<input type="date" id="${prefix}-start" ${attr("start")} value="${esc(start||"")}"></label>
    <label class="f" for="${prefix}-dur">Expected duration<select id="${prefix}-dur" ${attr("dur")}><option value="">Choose</option>${DURS.map(n=>`<option value="${n}" ${String(dur)===String(n)?"selected":""}>${n} months</option>`).join("")}<option value="custom" ${dur==="custom"?"selected":""}>Pick a date instead</option></select></label></div>
    <label class="f" for="${prefix}-target" ${dur==="custom"?"":"hidden"} id="${prefix}-tlabel">Target completion date<input type="date" id="${prefix}-target" ${attr("target")} value="${esc(target||"")}"></label>
    <p class="small muted" id="${prefix}-dnote">${durNote(start,dur,target)}</p>`;
}
function finalTarget(start,dur,target){return dur==="custom"?(target||""):dur?addMonths(start,dur):"";}

    if(S.home.auto&&!reduce())homeTimers.push(setInterval(()=>{if(!S.home.auto)return;S.home.step=(S.home.step+1)%STEPS.length;const y=window.scrollY;render();window.scrollTo(0,y);},7000));
    if("IntersectionObserver" in window&&!reduce()){
      const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("pop");S.seen.add(+e.target.dataset.ri);io.unobserve(e.target);}}),{threshold:.15});
      document.querySelectorAll(".reveal").forEach((el,i)=>{el.dataset.ri=i;if(!S.seen.has(i))io.observe(el);});
      const io2=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io2.unobserve(e.target);const el=e.target,to=+el.dataset.count;if(S.counted.has(to+el.nextElementSibling.textContent))return;S.counted.add(to+el.nextElementSibling.textContent);let s=null;const f=t=>{s=s||t;const k=Math.min(1,(t-s)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);};requestAnimationFrame(f);}),{threshold:.4});
      document.querySelectorAll("[data-count]").forEach(el=>io2.observe(el));
    }
  }
  if((S.view==="demo"||S.view==="guide")&&S.demo.play&&!reduce()){const L=(S.view==="guide"?GUIDE:DEMO).length;homeTimers.push(setInterval(()=>{if(S.demo.i<L-1){S.demo.i++;render();}else{S.demo.play=false;render();}},7000));}
}

/* ---------- billing (bank transfer) ---------- */
const fmtDay=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
function getBilling(pid){S.billing=S.billing||{};const b=S.billing[pid];
  if(!b){S.billing[pid]={loading:true};cfApi("GET","/api/billing?pid="+encodeURIComponent(pid)).then(d=>{S.billing[pid]=d;render();}).catch(()=>{S.billing[pid]={state:"active",err:true};});return null;}
  return b.loading?null:b;}
function billingBanner(role){
  const b=getBilling(S.pid);if(!b||b.err)return "";const dev=role==="developer",pay=b.payment,now=Date.now(),days=t=>Math.max(0,Math.ceil((t-now)/864e5));
  const btn=dev?(pay&&pay.status==="sent"?"":`<button class="btn sm pri" data-act="pay-open">${b.state==="trial"?"Pay now":"Renew"}</button>`):"";
  if(b.state==="paused")return `<div class="banner late"><div><b>This project is paused</b><p class="small" style="margin:4px 0 0">TrailConstruct has paused posting on this project${b.pauseReason?": "+esc(b.pauseReason):"."} Everything is still here. Contact hello@trailconstruct.com.</p></div></div>`;
  if(b.state==="locked")return `<div class="banner late"><div><b>This project is read-only</b><p class="small" style="margin:4px 0 0">${dev?(pay&&pay.status==="sent"?"We're confirming your transfer. Posting comes back as soon as it's confirmed.":"The subscription isn't paid, so nobody can post. Nothing has been deleted. Renew to switch it back on."):"The subscription isn't paid, so posting is paused. Everything is still here. Ask the developer to renew."}</p></div>${btn}</div>`;
  if(!dev)return b.state==="due"?`<div class="banner due"><div><b>Posting pauses on ${fmtDay(b.readOnlyFrom)}</b><p class="small" style="margin:4px 0 0">The project's subscription has ended. Ask the developer to renew.</p></div></div>`:"";
  if(pay&&pay.status==="sent")return `<div class="banner due"><div><b>Confirming your transfer</b><p class="small" style="margin:4px 0 0">${naira(pay.amount)} · ref ${esc(pay.ref)}. We'll confirm within a few hours on working days and email you a receipt.</p></div></div>`;
  if(b.state==="trial")return `<div class="banner due"><div><b>Pay for your pilot · ${days(b.graceUntil)} day${days(b.graceUntil)===1?"":"s"} left</b><p class="small" style="margin:4px 0 0">You can use the project until ${fmtDay(b.graceUntil)} while you pay. After that it becomes read-only until payment is confirmed.</p></div>${btn}</div>`;
  if(b.state==="due")return `<div class="banner late"><div><b>Your subscription has ended</b><p class="small" style="margin:4px 0 0">The project becomes read-only on ${fmtDay(b.readOnlyFrom)}. Renew to keep your team posting.</p></div>${btn}</div>`;
  if(b.paidUntil&&b.paidUntil-now<7*864e5)return `<div class="banner due"><div><b>Subscription ends on ${fmtDay(b.paidUntil)}</b><p class="small" style="margin:4px 0 0">Renew now so nothing stops. The new period starts when the current one ends.</p></div>${btn}</div>`;
  return "";
}

    if(payOn(p))msOf(p.id).forEach(m=>{if(m.status==="pending"&&phasePct(p,m.phase)>=.999)todo.push(["ok",`"${esc(m.name)}" is ready. Request release of ${naira(m.amount)}`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);if(m.status==="requested")todo.push(["",`Record verification for "${esc(m.name)}"`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);if(m.status==="approved")todo.push(["ok",`Investor approved "${esc(m.name)}". Confirm when the money arrives`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);if(m.status==="disputed")todo.push(["crit",`Investor disputed "${esc(m.name)}"`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);});
    if(p.siteLat==null||p.siteLat==="")todo.push(["","Add the site's GPS location so photos can be checked as taken on site",`<button class="btn sm" data-act="edit-project">Add location</button>`]);

    const ws=weekStatus(p.id);if(ws.late)todo.push(["crit","This week's site report is overdue",waLink(`Hi, this week's TrailConstruct report for ${p.name} is overdue. Please send it today.`,"Remind on WhatsApp")]);else if(!ws.report&&ws.left<=2)todo.push(["","Weekly site report due Friday",waLink(`Hi, reminder: this week's TrailConstruct report for ${p.name} is due Friday ${fmtS(ymd(ws.w.fri))}.`,"Remind on WhatsApp")]);
    body=`<section class="card"><div class="card-h"><div><h2>${esc(p.name)}</h2><p class="small muted">${esc([p.location,unitsText(p),floorsLabel(p.floors)].filter(Boolean).join(" · "))}</p></div></div>
      ${phaseStrip(pr)}
      <div class="stats"><div class="stat"><b>${esc(pr.current?pr.current.name:"Complete")}</b><span>Current stage</span></div>
        <div class="stat"><b class="num">${ago==null?"—":ago===0?"Today":ago+"d ago"}</b><span>Last site update</span></div>
        <div class="stat"><b class="num">${upAgo==null?"None":upAgo===0?"Today":upAgo+"d ago"}</b><span>Last investor update</span></div>
        <div class="stat"><b class="num">${ws.report?"In":"Due Fri"}</b><span>Weekly site report</span></div></div></section>

    <section class="card"><div class="card-h"><h2>Latest from site</h2><button class="link small" data-act="tab" data-role="developer" data-tab="site">See all</button></div>${logs.length?`<div class="list">${logs.slice(0,2).map(l=>logHTML(p,l)).join("")}</div>`:`<div class="empty">Nothing posted yet.</div>`}</section>`;
  }
  if(t==="site"){

      <section class="card"><h2>Daily site diary</h2>${logs.length?`<div class="list">${logs.slice(0,15).map(l=>logHTML(p,l)).join("")}</div>`:`<div class="empty">No daily updates yet.</div>`}</section></div>`;

  if(t==="investor")body=composeView(p,pr,ups);

  if(t==="stages")body=outstandingCard(p,50)+`<section class="card"><div class="card-h"><h2>Stages</h2>${S.canWrite?`<button class="btn sm" data-act="set-stage">Set current stage</button>`:`<span class="small muted">Tap a stage to open its checklist</span>`}</div>${phaseStrip(pr)}${stageList(p)}</section>`;

      ${budget?bar(spent/budget,spent>budget?"over":""):`<p class="small muted">Set the budget in the Project tab to compare spend against progress.</p>`}</section>
    <div class="grid2">${S.canWrite?`<section class="card"><h3>Add expense</h3><form id="exp-form">

    <section class="card"><h3>Recent spending</h3>${exps.length?`<div>${exps.slice(0,15).map(e=>`<div class="exp"><span>${esc(e.item)}</span><b class="num">${naira(e.amount)}</b><span class="small muted">${esc(stageName(p,e.stage))} · ${esc(fmtS(e.date))}</span>${S.canWrite?`<button class="link small" data-act="del-exp" data-id="${e.id}">Remove</button>`:"<span></span>"}</div>`).join("")}</div>`:`<div class="empty">No expenses recorded.</div>`}</section></div>`;
  }
  if(t==="project"){
    body=(S.mode==="cf"?teamSection(p)+activitySection(p):"")+`<section class="card"><div class="card-h"><h2>Project details</h2>${S.canWrite?`<div class="actions"><button class="btn sm" data-act="edit-project">Edit</button><button class="btn sm" data-act="new-project">Add another project</button></div>`:""}</div>
      <dl class="kv"><dt>Name</dt><dd>${esc(p.name)}</dd><dt>Location</dt><dd>${esc(p.location||"—")}</dd><dt>Property</dt><dd>${esc(unitsText(p)||"—")}</dd><dt>Floors</dt><dd>${floorsLabel(p.floors)}</dd><dt>Developer</dt><dd>${esc(p.client||"—")}</dd><dt>Budget</dt><dd>${+p.budget?naira(p.budget):"Not set"}</dd><dt>Start</dt><dd>${esc(fmtD(p.startDate)||"Not set")}</dd><dt>Target completion</dt><dd>${esc(fmtD(p.targetDate)||"Not set")}</dd><dt>Foundation</dt><dd>${esc(FOUNDATIONS[p.foundationType]?FOUNDATIONS[p.foundationType].label:"Not decided yet")}</dd><dt>Sewage</dt><dd>${esc((SEWAGE[p.sewageType]||SEWAGE.septic).label)}</dd><dt>Site GPS</dt><dd>${p.siteLat!=null&&p.siteLat!==""?esc((+p.siteLat).toFixed(5)+", "+(+p.siteLng).toFixed(5))+" · photos within "+(+p.siteRadius||200)+" m"+(p.strictGps?" · GPS required":""):"Not set. Add it so site photos can be checked."}</dd><dt>Funding</dt><dd>${payOn(p)?"Milestone payments"+(+p.contractSum?" · "+naira(p.contractSum):""):"Paid up front"}</dd></dl></section>

function engView(p){
  const pr=progress(p),ws=weekStatus(p.id),me=ls.get("st.name")||"",wlogs=logsOf(p.id).filter(l=>l.date>=ws.w.key);
  const tabs=[["today","Today"],["stages","Checklist"],["weekly","Weekly report",ws.report?0:(ws.late?"!":0)],["materials","Materials"],["history","History"]];
  const t=S.tab.engineer;let body="";
  let ban;
  if(ws.report)ban=`<div class="banner done"><div><strong>Weekly report sent</strong><span class="small">Thanks. The developer has it.</span></div></div>`;
  else if(ws.late)ban=`<div class="banner late"><div><strong>Weekly report overdue</strong><span class="small">It was due Friday ${esc(fmtS(ymd(ws.w.fri)))}.</span></div><button class="btn amber" data-act="tab" data-role="engineer" data-tab="weekly">Write it now</button></div>`;
  else ban=`<div class="banner due"><div><strong>Weekly report due Friday ${esc(fmtS(ymd(ws.w.fri)))}</strong><span class="small">${ws.left<=0?"Due today":ws.left+" day"+(ws.left===1?"":"s")+" left"} · ${wlogs.length} update${wlogs.length===1?"":"s"} this week</span></div>${t!=="weekly"?`<button class="btn amber" data-act="tab" data-role="engineer" data-tab="weekly">Write report</button>`:""}</div>`;
  if(t==="today"){
    const ob=outbox.get().filter(x=>x.pid===p.id),lastMine=logsOf(p.id).find(l=>l.by===me&&l.date===ymd(new Date()));

const reqOf=pid=>S.matreqs.filter(r=>r.pid===pid).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
const movesOf=pid=>S.stock.filter(r=>r.pid===pid).sort(byDateDesc);
const REQ_PILL={pending:["active","Waiting for approval"],approved:["ok","Approved"],rejected:["crit","Declined"],delivered:["ok","Delivered"]};
function stockRows(pid){
  const m=new Map();movesOf(pid).forEach(x=>{const k=(x.item||"").trim().toLowerCase();if(!k)return;if(!m.has(k))m.set(k,{item:x.item.trim(),unit:x.unit||"",inn:0,out:0});const r=m.get(k);if(x.type==="out")r.out+=+x.qty||0;else r.inn+=+x.qty||0;});
  return [...m.values()].map(r=>{const bal=r.inn-r.out;return {...r,bal,flag:bal<0?"crit":r.inn&&bal<=r.inn*.1?"low":""};}).sort((a,b)=>(a.flag==="crit"?-1:0)-(b.flag==="crit"?-1:0)||a.item.localeCompare(b.item));
}
function stockTable(pid){

}

/* milestone payments */
const msOf=pid=>S.milestones.filter(m=>m.pid===pid).sort((a,b)=>(a.order||0)-(b.order||0));
const MS={pending:["","Not due yet"],requested:["active","Awaiting verification"],verified:["active","Awaiting investor approval"],approved:["ok","Approved, releasing"],paid:["ok","Paid"],disputed:["crit","Disputed"]};
const MS_TEMPLATE=[["Foundation complete","Foundation",.20],["Frame complete","Frame",.30],["Roof on","Roofing",.15],["M&E rough-in and plastering","Plastering",.15],["Finishes complete","Finishes",.15],["Handover","Handover",.05]];
const phasePct=(p,name)=>{const x=progress(p).phases.find(q=>q.name===name);return x?x.pct:0;};
function msSummary(p){
  const ms=msOf(p.id),contract=+p.contractSum||ms.reduce((a,m)=>a+(+m.amount||0),0);
  const paid=ms.filter(m=>m.status==="paid").reduce((a,m)=>a+(+m.amount||0),0);
  const inflight=ms.filter(m=>["requested","verified","approved"].includes(m.status)).reduce((a,m)=>a+(+m.amount||0),0);
  return {ms,contract,paid,inflight,left:Math.max(0,contract-paid-inflight)};
}
function msPipe(m){const order=["requested","verified","approved","paid"],i=order.indexOf(m.status==="disputed"?"verified":m.status);
  return `<ol class="pipe">${["Requested","Verified","Approved","Paid"].map((l,k)=>`<li class="${k<=i?(m.status==="disputed"&&k===i?"bad":"on"):""}"><i></i><span>${l}</span></li>`).join("")}</ol>`;}
function msCard(p,m,role){
  const [c,l]=MS[m.status]||["",m.status],pct=phasePct(p,m.phase),ready=pct>=.999;
  let act="";
  if(S.canWrite){
    if(role==="developer"){
      if(m.status==="pending")act=ready?`<button class="btn sm pri" data-act="ms-request" data-id="${m.id}">Request release</button>`:`<span class="small muted">Unlocks when ${esc(m.phase)} is complete (${Math.round(pct*100)}% now)</span>${`<button class="link small" data-act="ms-del" data-id="${m.id}">Remove</button>`}`;
      if(m.status==="requested")act=`<button class="btn sm pri" data-act="ms-verify" data-id="${m.id}">Record verification</button>`;
      if(m.status==="verified")act=waLink(`Hi, the "${m.name}" milestone on ${p.name} has been independently verified. Please review and approve the release of ${naira(m.amount)} on TrailConstruct.`,"Ask investor to approve");
      if(m.status==="approved")act=`<button class="btn sm pri" data-act="ms-paid" data-id="${m.id}">Confirm payment received</button>`;
      if(m.status==="disputed")act=`<button class="btn sm" data-act="ms-resubmit" data-id="${m.id}">Resubmit for verification</button>`;
    }
    if(role==="investor"){
      if(m.status==="verified")act=`<button class="btn sm pri" data-act="ms-approve" data-id="${m.id}">Approve release</button><button class="btn sm" data-act="ms-dispute" data-id="${m.id}">Dispute</button>`;
    }
  }
  return `<div class="ms-card ${c}"><div class="card-h"><div><b>${esc(m.name)}</b><p class="small muted">${esc(m.phase)} phase · ${Math.round(pct*100)}% done</p></div><div style="text-align:right"><b class="num">${naira(m.amount)}</b><br><span class="pill ${c}">${l}</span></div></div>
  ${m.status!=="pending"?msPipe(m):""}
  ${m.verification?`<p class="small"><b>Verified by</b> ${esc(m.verification.by)}${m.verification.org?" ("+esc(m.verification.org)+")":""} on ${esc(fmtS(m.verification.date))}${m.verification.note?": "+esc(m.verification.note):""}</p>`:""}
  ${m.dispute?`<div class="issue"><b>Investor's concern:</b> ${esc(m.dispute)}</div>`:""}
  ${m.payRef?`<p class="small muted">Payment ref: ${esc(m.payRef)} · ${esc(fmtS(m.paidAt))}</p>`:""}
  ${m.evidence&&m.evidence.length&&m.status!=="pending"?photoGrid(m.evidence):""}
  ${act?`<div class="actions">${act}</div>`:""}</div>`;
}
function paymentsView(p,role){
  if(!payOn(p))return `<section class="card"><h2>Funding</h2><p><span class="pill ok">Paid up front</span></p><p class="muted">This project is fully funded, so there are no milestone payments to track.${role==="developer"&&S.canWrite?` You can switch to milestone payments in the Project tab.`:""}</p></section>`;
  const s=msSummary(p);
  const sum=`<section class="card"><div class="card-h"><h2>Milestone payments</h2><span class="pill">Escrow partner: not connected</span></div>
    <div class="stats"><div class="stat t1"><b class="num">${nairaS(s.contract)}</b><span>Contract sum</span></div><div class="stat t3"><b class="num">${nairaS(s.paid)}</b><span>Released</span></div><div class="stat t2"><b class="num">${nairaS(s.inflight)}</b><span>In progress</span></div><div class="stat t4"><b class="num">${nairaS(s.left)}</b><span>Still to come</span></div></div>
    ${s.contract?`<div class="paybar"><i class="pb-paid" style="width:${(s.paid/s.contract*100).toFixed(1)}%"></i><i class="pb-fly" style="width:${(s.inflight/s.contract*100).toFixed(1)}%"></i></div>`:""}
    <p class="small muted">Money moves only after a milestone's work is complete, independently verified and approved by the investor. In the full build, approval tells the escrow bank to release the funds automatically.</p></section>`;
  const list=s.ms.length?`<section class="card"><h3>Schedule</h3>${s.ms.map(m=>msCard(p,m,role)).join("")}</section>`
    :`<section class="card"><div class="empty">${role==="developer"?"No payment schedule yet.":"The developer hasn't set up the payment schedule yet."}</div>${role==="developer"&&S.canWrite?`<div class="actions"><button class="btn pri" data-act="ms-template">Create standard schedule</button></div><p class="small muted">Foundation 20% · Frame 30% · Roof 15% · M&E and plastering 15% · Finishes 15% · Handover 5%, based on the contract sum. You can remove or add milestones after.</p>`:""}</section>`;
  const add=role==="developer"&&S.canWrite?`<section class="card"><h3>Add a milestone</h3><form id="ms-form"><div class="row"><label class="f" for="ms-name">Name<input type="text" id="ms-name" required placeholder="e.g. Ground floor slab cast"></label>
    <label class="f" for="ms-phase">Released when this phase is complete<select id="ms-phase">${progress(p).phases.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></label><label class="f" for="ms-amt">Amount (₦)<input type="number" id="ms-amt" min="0" required></label></div><div><button class="btn" type="submit">Add milestone</button></div></form></section>`:"";
  return sum+list+add;
}
function verifyForm(m){modal(`<h2>Record verification</h2><p class="small muted">Who inspected the work for "${esc(m.name)}"? Use an independent engineer or inspector, not the site team.</p>
  <form id="ver-form" data-id="${m.id}"><label class="f" for="vf-by">Inspector name<input type="text" id="vf-by" required placeholder="e.g. Engr. Ifeanyi Lawal"></label><label class="f" for="vf-org">Organisation<input type="text" id="vf-org" placeholder="e.g. Eppcheck, or a COREN-registered consultant"></label>

  return shell("investor",tabs,body,true);
}

function render(){renderInner();afterRender();renderShots();if(S.view==="home")S.ringDone=true;}
function renderInner(){
  const app=document.getElementById("app"),v=S.view;
  if(v==="home"){app.innerHTML=homeView();return;}
  if(v==="privacy"||v==="terms"){app.innerHTML=legalView(v);return;}
  if(S.mode==="cf"&&["developer","engineer","investor","admin"].includes(v)&&!S.me){if(v==="admin")S.afterLogin="admin";S.view="signin";history.replaceState(null,"","#signin");}
  if(S.mode==="cf"&&S.view==="signin"){if(S.me&&!S.pendingInvite&&S.authMode!=="reset"){const r=S.pid?roleFor(S.pid):null;S.view=r||"developer";history.replaceState(null,"","#"+S.view);}else{app.innerHTML=cfAuthView();return;}}
  if(S.mode==="cf"&&["developer","engineer","investor"].includes(S.view)&&S.pid){const r=roleFor(S.pid);if(r&&r!==S.view){S.view=r;history.replaceState(null,"","#"+r);}}
  if(S.view==="signin"){app.innerHTML=signinView();return;}
  if(S.view==="signup"){app.innerHTML=signupView();return;}
  if((S.view==="demo"||S.view==="guide")&&S.tourView!==S.view){S.tourView=S.view;S.demo.i=0;S.demo.play=false;}
  if(S.view!=="demo"&&S.view!=="guide")S.tourView=null;
  if(S.view==="demo"){app.innerHTML=demoView();return;}
  if(S.view==="guide"){app.innerHTML=guideView();return;}
  if(S.view==="admin"){app.innerHTML=S.mode==="cf"&&S.me&&S.admin?adminView():shell("developer",null,`<div class="card"><div class="empty">Not available.</div></div>`);return;}
  if(S.mode==="loading"||(S.db&&!S.loaded.projects)){app.innerHTML=shell(v,null,`<div class="card"><div class="empty">${S.slow?"Can't reach the project data yet. It will appear when the connection returns.":"Loading your projects…"}</div></div>`);return;}
  const vv=S.view,p=P();if(!p){app.innerHTML=noProject(vv);return;}

}

// Ticks every checklist item in the phases before phase number idx. With untickLater, clears the rest.
function checksUpTo(proj,idx,untickLater){const pr=progress(proj),done=new Set(pr.phases.slice(0,idx).map(x=>x.name)),out={};
  stagesFor(proj).forEach(st=>st.items.forEach(i=>{if(done.has(st.group))out[i.id]=true;else if(untickLater)out[i.id]=false;}));return out;}
// A site engineer can only untick what they ticked themselves in the last 24 hours. Developers can always change ticks.
function tickLocked(p,id){if(S.mode!=="cf"||!S.me||roleFor(p.id)!=="engineer")return false;const m=(p.checksMeta||{})[id];return !(m&&m.by===S.me.id&&Date.now()-m.at<864e5);}

/* ---------- PDF report ---------- */
function loadImg(url){return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{try{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res({data:c.toDataURL("image/jpeg",.82),w:c.width,h:c.height});}catch(e){res(null);}};im.onerror=()=>res(null);im.src=url;});}
async function makePDF(p,u){
  if(!S.downloads){toast("Downloads aren't available here.");return;}
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast("The report tool didn't load. Check your connection and try again.");return;}
  toast("Preparing report…");
  const snap=u.snapshot||(()=>{const pr=progress(p);return {overall:pr.overall,current:pr.current?pr.current.name:"Completed",next:pr.next?pr.next.name:"Handover",phases:pr.phases.map(x=>({name:x.name,pct:x.pct}))};})();
  const doc=new J({unit:"mm",format:"a4"}),W=210,M=16,CW=W-2*M;let y=0;
  const need=h=>{if(y+h>282){doc.addPage();y=18;}};
  const txt=(t,size,style,color)=>{doc.setFont("helvetica",style||"normal");doc.setFontSize(size);doc.setTextColor(...(color||[21,32,42]));const lines=doc.splitTextToSize(String(t||""),CW);lines.forEach(l=>{need(size*.45);doc.text(l,M,y);y+=size*.45;});};
  doc.setFillColor(29,53,70);doc.rect(0,0,W,30,"F");doc.setFillColor(240,165,0);doc.rect(0,30,W,2,"F");
  let tx=M;try{const mi=await markImg("#ffffff","#f0a500",200);if(mi){const c=document.createElement("canvas");c.width=mi.width;c.height=mi.height;c.getContext("2d").drawImage(mi,0,0);doc.addImage(c.toDataURL("image/png"),"PNG",M,7,16.8,14);tx=M+21;}}catch(e){}
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(255,255,255);doc.text("Trail",tx,15);const tw=doc.getTextWidth("Trail");doc.setTextColor(240,165,0);doc.text("Construct",tx+tw,15);
  doc.setTextColor(255,255,255);doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text("Investor progress report · Every stage, on record.",tx,22);doc.text(fmtD(u.date),W-M,22,{align:"right"});
  y=44;txt(p.name,18,"bold");y+=1;txt([p.location,unitsText(p),floorsLabel(p.floors)].filter(Boolean).join("  ·  "),10,"normal",[91,101,112]);y+=4;
  txt(u.title,13,"bold");y+=2;
  need(26);doc.setFillColor(246,247,243);doc.roundedRect(M,y,CW,24,3,3,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(24);doc.setTextColor(43,74,94);doc.text(Math.round(snap.overall*100)+"%",M+6,y+15);
  doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(91,101,112);doc.text("complete",M+6,y+20);
  doc.setTextColor(21,32,42);doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text("Now:",M+42,y+10);doc.text("Next:",M+42,y+17);
  doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(snap.current,CW-58)[0],M+54,y+10);doc.text(doc.splitTextToSize(snap.next,CW-58)[0],M+54,y+17);y+=32;
  txt("Briefing",12,"bold");y+=1;txt(u.briefing,10.5);y+=3;
  if(u.next){txt("What's next",12,"bold");y+=1;txt(u.next,10.5);y+=3;}
  txt("Progress by phase",12,"bold");y+=2;
  snap.phases.forEach(ph=>{need(7);doc.setFontSize(9.5);doc.setFont("helvetica","normal");doc.setTextColor(21,32,42);doc.text(ph.name,M,y+3.5);
    const bx=M+52,bw=CW-70;doc.setFillColor(223,226,219);doc.roundedRect(bx,y,bw,4.5,2,2,"F");
    if(ph.pct>0){doc.setFillColor(...(ph.pct>=.999?[44,122,75]:[240,165,0]));doc.roundedRect(bx,y,Math.max(4,bw*ph.pct),4.5,2,2,"F");}
    doc.text(Math.round(ph.pct*100)+"%",W-M,y+3.5,{align:"right"});y+=7;});
  y+=3;
  if(u.budget){txt("Budget",12,"bold");y+=1;txt(`${naira(u.budget.spent).replace("₦","NGN ")} spent of ${naira(u.budget.budget).replace("₦","NGN ")} (${u.budget.budget?Math.round(u.budget.spent/u.budget.budget*100):0}%)`,10.5);y+=3;}
  const ph=u.photos||[];
  if(ph.length){need(12);txt("Site photos",12,"bold");y+=2;const cw=(CW-6)/2,chh=cw*0.72;let col=0;
    for(const x of ph){const im=await loadImg(src(x));if(!im)continue;if(col===0)need(chh+8);
      const r=Math.min(cw/im.w,chh/im.h),w=im.w*r,h=im.h*r,xx=M+col*(cw+6)+(cw-w)/2;
      doc.addImage(im.data,"JPEG",xx,y+(chh-h)/2,w,h);if(x.cap){doc.setFontSize(8);doc.setTextColor(91,101,112);doc.text(x.cap,M+col*(cw+6),y+chh+4);}
      col++;if(col===2){col=0;y+=chh+8;}}
    if(col)y+=chh+8;}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(140,140,140);doc.text("TrailConstruct · "+p.name+" · Page "+i+" of "+n,W/2,292,{align:"center"});}
  const name=(p.name+"-"+(u.date||"report")).replace(/[^A-Za-z0-9-]+/g,"-")+".pdf";
  try{await S.downloads.save({filename:name,data:doc.output("blob")});}
  catch(e){if(e&&e.code!=="declined")toast("Couldn't save the report. Try again.");}
}

/* ---------- Cloudflare mode: own backend (D1 + R2), real accounts ---------- */
async function cfApi(method,url,body,raw,extra){
  const r=await fetch(url,{method,credentials:"same-origin",headers:{...(raw?{"content-type":raw.type||"application/octet-stream"}:body?{"content-type":"application/json"}:{}),...(extra||{})},body:raw||(body?JSON.stringify(body):undefined)});
  let d=null;try{d=await r.json();}catch(e){}
  if(r.status===401){S.me=null;throw {code:"unauthenticated",message:(d&&d.error)||"Please sign in."};}
  if(r.status===403)throw {code:"forbidden",message:(d&&d.error)||"Not allowed."};
  if(r.status===429)throw {code:"rate",message:(d&&d.error)||"Too many attempts. Wait a few minutes and try again."};
  if(r.status===402){if(S.pid&&S.billing)delete S.billing[S.pid];throw {code:"locked",message:(d&&d.error)||"This project is read-only until its subscription is paid."};}
  if(r.status===422||r.status===415||r.status===413||(r.status===409&&url.startsWith("/api/upload")))throw {code:"rejected",message:(d&&d.error)||"This photo wasn't accepted."};
  if(!r.ok)throw {code:r.status===409?"conflict":"unavailable",message:(d&&d.error)||("The server couldn't finish this (error "+r.status+"). Please try again in a minute.")};
  return d;
}
