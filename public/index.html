<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrailConstruct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: marketing home → sign-in → one focused workspace per role, tabbed. Concrete neutrals, steel-blue actions, hi-vis amber for attention. */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --sunk:#f6f7f3; --ink:#15202a; --muted:#5b6570; --line:#dfe2db;
  --steel:#2b4a5e; --steel-ink:#ffffff; --amber:#f0a500; --amber-soft:#fdf1d2;
  --ok:#2c7a4b; --ok-soft:#e2f1e7; --warn:#99600a; --crit:#b8382b; --crit-soft:#f8e3e0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161a; --surface:#1a2127; --sunk:#151b20; --ink:#e6eae4; --muted:#98a2aa; --line:#2b343c;
    --steel:#86b0c8; --steel-ink:#0f1a22; --amber:#f2b42e; --amber-soft:#3a2f14;
    --ok:#5cc184; --ok-soft:#173022; --warn:#e0a640; --crit:#ef7466; --crit-soft:#3b1d1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161a; --surface:#1a2127; --sunk:#151b20; --ink:#e6eae4; --muted:#98a2aa; --line:#2b343c;
  --steel:#86b0c8; --steel-ink:#0f1a22; --amber:#f2b42e; --amber-soft:#3a2f14;
  --ok:#5cc184; --ok-soft:#173022; --warn:#e0a640; --crit:#ef7466; --crit-soft:#3b1d1a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
.sr{position:absolute;left:-9999px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1b1404}
.btn.sm{padding:6px 11px;font-size:.86rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--steel);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.mark{width:22px;height:22px;flex:none;background:repeating-linear-gradient(135deg,var(--amber) 0 5px,#15202a 5px 10px);border-radius:5px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.45rem;font-weight:700;color:var(--ink);text-decoration:none}

/* ---------- home ---------- */
.nav{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:16px;padding-bottom:16px;position:relative;z-index:2;display:flex;align-items:center;gap:16px}
.nav .sp{flex:1}
.nav a.nl{color:var(--muted);text-decoration:none;font-weight:500}
@media (max-width:560px){.nav a.nl{display:none}}
.hero{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:28px;padding-bottom:56px;position:relative;z-index:2;display:grid;gap:32px;align-items:center}
@media (min-width:900px){.hero{grid-template-columns:1.1fr .9fr;padding-top:56px;gap:56px}}
.hero h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--amber) 62%)}
.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-top:14px}
.hero .actions{margin-top:22px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;box-shadow:0 18px 40px -24px rgba(21,32,42,.35)}
.demo-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:56px;padding-bottom:56px;position:relative;display:grid;gap:22px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.roles3{display:grid;gap:14px}
@media (min-width:800px){.roles3{grid-template-columns:repeat(3,1fr)}}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;align-content:start}
.rcard .tag{display:inline-block;font-family:var(--display);font-size:1.6rem;font-weight:700}
.rcard ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rcard .bar-top{height:5px;border-radius:9px;background:var(--steel);width:42px}
.rcard:nth-child(2) .bar-top{background:var(--amber)}
.rcard:nth-child(3) .bar-top{background:var(--ok)}
.flow{display:grid;gap:12px;counter-reset:f}
@media (min-width:800px){.flow{grid-template-columns:repeat(3,1fr)}}
.flow li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px}
.flow li b{font-family:var(--display);font-size:1.25rem}
.flow li::before{counter-increment:f;content:"Step " counter(f);font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.flow{padding:0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.price{background:var(--steel);color:var(--steel-ink);border-radius:16px;padding:26px;display:grid;gap:12px}
@media (min-width:800px){.price{grid-template-columns:1fr auto;align-items:center}}
.price .big{font-family:var(--display);font-size:3rem;line-height:1}
.price .btn{background:var(--amber);border-color:var(--amber);color:#1b1404}
.hfoot{max-width:1320px;margin:0 auto;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);padding-top:24px;padding-bottom:48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.86rem;border-top:1px solid var(--line)}

/* ---------- sign in ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.auth-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:440px;display:grid;gap:16px}
.pick{display:grid;gap:10px}
.pick button{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);cursor:pointer}
.pick button:hover{border-color:var(--steel)}
.pick .ic{grid-row:span 2;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;background:var(--steel);color:var(--steel-ink)}
.pick b{font-size:1rem}
.note{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:10px;padding:10px 12px;font-size:.86rem}

/* ---------- app shell ---------- */
.apphead{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.apphead-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.apphead .sp{flex:1}
.who{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.proj{max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-weight:600}
.tabs{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--amber);color:#1b1404;font-size:.72rem;line-height:18px;text-align:center}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main.narrow{max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:800px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}

.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.active{background:var(--amber-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}

.bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--steel);border-radius:99px}
.bar.over>i{background:var(--crit)}

/* phases strip */
.phases{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.phases i{height:10px;border-radius:3px;background:var(--line)}
.phases i.done{background:var(--ok)}
.phases i.active{background:var(--amber)}
.ph-cap{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.45rem;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:.8rem;color:var(--muted)}

.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--sunk);border-left:4px solid var(--amber);flex-wrap:wrap}
.todo li.ok{border-left-color:var(--ok)}
.todo li.crit{border-left-color:var(--crit)}

.banner{border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.due{background:var(--amber-soft);border:1px solid var(--amber)}
.banner.late{background:var(--crit-soft);border:1px solid var(--crit)}
.banner.done{background:var(--ok-soft)}
.banner strong{font-family:var(--display);font-size:1.3rem;display:block}

/* stages */
.stages{display:grid;gap:6px}
.grp{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:10px}
.stage{border:1px solid var(--line);border-radius:10px}
.stage.active{border-left:4px solid var(--amber)}
.stage.done{border-left:4px solid var(--ok)}
.stage-h{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border:0;background:none;padding:10px 12px;text-align:left;cursor:pointer}
.stage-h .bar{grid-column:1/-1}
.checks{list-style:none;margin:0;padding:0 12px 12px;display:grid;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.checks label:hover{background:var(--sunk)}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--steel);flex:none}
.done-t{color:var(--muted);text-decoration:line-through}

/* logs & reports */
.list{display:grid;gap:0}
.log{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.log:first-child{border-top:0;padding-top:0}
.log-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.issue{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:6px 10px;font-size:.9rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.photos.lg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ph{position:relative;border:0;padding:0;background:var(--sunk);border-radius:9px;overflow:hidden;aspect-ratio:1;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sel{cursor:pointer;outline:0}
.ph.sel[aria-pressed="true"]{box-shadow:0 0 0 3px var(--amber)}
.ph .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.ph.sel[aria-pressed="true"] .tick{background:var(--amber);color:#1b1404;border-color:var(--amber)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:.7rem;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;text-align:left}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.rep ul{margin:0;padding-left:18px}

/* forms */
form{display:grid;gap:12px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.f{display:grid;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);font-weight:400}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--steel)}
.upl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--sunk)}
.upl input{max-width:100%}

/* investor */
.ihero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:460px){.ihero{grid-template-columns:1fr;justify-items:start}.ihero>div{width:100%}}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.upd{display:grid;gap:12px}
.upd-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.upd-row:first-child{border-top:0}

.exp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.modal{position:fixed;inset:0;background:rgba(10,14,18,.6);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:grid;gap:12px}
.sheet img{max-width:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}

/* ---------- colour & life ---------- */
:root{--deep:#1d3546;--sky:#e4eef5;--sky-ink:#24526e;--mint:#e2f1e7;--sand:#fdf1d2;--rose:#f9e6e1;--rose-ink:#9b3b26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--deep:#0e1e29;--sky:#18303f;--sky-ink:#9fcbe6;--mint:#173022;--sand:#3a2f14;--rose:#3a221c;--rose-ink:#f0a08c}}
:root[data-theme="dark"]{--deep:#0e1e29;--sky:#18303f;--sky-ink:#9fcbe6;--mint:#173022;--sand:#3a2f14;--rose:#3a221c;--rose-ink:#f0a08c}
.band{background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(1200px 500px at 85% -10%,#2f5a74 0,transparent 60%),var(--deep);color:#fff;padding-bottom:28px}
.band .brand{color:#fff}
.band .nav a.nl{color:rgba(255,255,255,.75)}
.band .lead{color:rgba(255,255,255,.78)}
.band .hero h1 em{background:linear-gradient(transparent 62%,var(--amber) 62%);color:#fff}
.kicker{display:inline-block;margin-bottom:14px;padding:4px 10px;border-radius:999px;background:rgba(240,165,0,.16);color:#ffd36b;font-size:.82rem;font-weight:600}
.btn.outline{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.outline:hover{border-color:#fff}
.band .demo{color:var(--ink)}
.sh{font-size:2rem;margin-top:6px}
.rcard{position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px}
.rcard.r1::before{background:var(--steel)} .rcard.r2::before{background:var(--amber)} .rcard.r3::before{background:var(--ok)}
.ricon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.r1 .ricon{background:var(--sky);color:var(--sky-ink)} .r2 .ricon{background:var(--sand);color:var(--warn)} .r3 .ricon{background:var(--mint);color:var(--ok)}
.flow li{border-top:5px solid var(--line)}
.flow li.f1{border-top-color:var(--steel)} .flow li.f2{border-top-color:var(--amber)} .flow li.f3{border-top-color:var(--ok)}
.chip.c0{background:var(--sky);color:var(--sky-ink);border-color:transparent} .chip.c1{background:var(--sand);color:var(--warn);border-color:transparent}
.chip.c2{background:var(--mint);color:var(--ok);border-color:transparent} .chip.c3{background:var(--rose);color:var(--rose-ink);border-color:transparent}
.price{background:linear-gradient(135deg,var(--deep),#2b4a5e);color:#fff}

/* app header in brand colour */
.apphead{background:var(--deep);border-bottom:0;color:#fff}
.apphead .brand{color:#fff}
.apphead .who{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.apphead .btn.ghost{color:#fff}
.apphead .proj{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.apphead .proj option{color:#15202a}
.tabs button{color:rgba(255,255,255,.65)}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--amber)}

/* tinted stats */
.stat.t1{background:var(--sky)} .stat.t1 b{color:var(--sky-ink)}
.stat.t2{background:var(--sand)} .stat.t2 b{color:var(--warn)}
.stat.t3{background:var(--mint)} .stat.t3 b{color:var(--ok)}
.stat.t4{background:var(--rose)} .stat.t4 b{color:var(--rose-ink)}
main .stats>.stat:nth-child(1):not([class*=" t"]){background:var(--sky)}
main .stats>.stat:nth-child(2):not([class*=" t"]){background:var(--sand)}
main .stats>.stat:nth-child(3):not([class*=" t"]){background:var(--mint)}
main .stats>.stat:nth-child(4):not([class*=" t"]){background:var(--rose)}

/* investor cover */
.cover{border-radius:16px;min-height:200px;display:grid;align-items:end;overflow:hidden;color:#fff;
  background:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(135deg,var(--deep),#2f5a74)}
.cover.has{min-height:240px;background:linear-gradient(180deg,rgba(10,18,26,.05) 20%,rgba(10,18,26,.82)),var(--img) center/cover no-repeat,var(--deep)}
.cover-in{padding:18px;display:grid;gap:6px;justify-items:start}
.cover h1{font-size:clamp(1.8rem,6vw,2.4rem)}
.cover p{opacity:.85}

/* ---------- home v3 ---------- */
.band{position:relative;overflow:hidden}
.bp{position:absolute;right:-40px;bottom:-10px;width:min(820px,95vw);height:auto;color:rgba(160,205,235,.22);z-index:1;pointer-events:none}
@media (max-width:899px){.bp{opacity:.6;right:-120px}}
.bp .dr *{stroke-dasharray:1;stroke-dashoffset:0}
.bp .sway{transform-origin:600px 52px}
@media (prefers-reduced-motion:no-preference){
  .bp .dr *{animation:draw 2.8s ease-out both}
  .bp .dr:nth-of-type(2) *{animation-delay:.2s}.bp .dr:nth-of-type(3) *{animation-delay:.5s}
  .bp .tx{animation:fadein 1.2s 1.8s both}
  .bp .sway{animation:sway 5s ease-in-out infinite}
  .float{animation:float 6s ease-in-out infinite}
  .ring-anim .ring circle:nth-of-type(2){animation:ringin 1.6s .3s cubic-bezier(.2,.8,.2,1) both}
  .reveal.pop{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  #feed.in{animation:feedin .45s ease both}
  .dot-live{animation:pulse 1.6s infinite}
  .step-panel,.demo-stage,.phase-detail{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .stp[aria-selected="true"] .stp-bar>i{animation:fill 7s linear both}
  .btn{transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .btn:hover{transform:translateY(-1px)}
  .rcard,.plan-card,.pain{transition:transform .25s ease,box-shadow .25s ease}
  .rcard:hover,.plan-card:hover,.pain:hover{transform:translateY(-4px);box-shadow:0 18px 36px -24px rgba(21,32,42,.45)}
}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ringin{from{stroke-dasharray:0 400}}
@keyframes rise{from{transform:translateY(18px);opacity:.35}to{transform:none;opacity:1}}
@keyframes feedin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,122,75,.5)}70%{box-shadow:0 0 0 8px rgba(44,122,75,0)}100%{box-shadow:0 0 0 0 rgba(44,122,75,0)}}
@keyframes fill{from{width:0}to{width:100%}}

.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right}
.tbl tr.crit td{background:var(--crit-soft)}
.seg{display:inline-flex;padding:4px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);gap:4px;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:7px 12px;border-radius:7px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg input:checked+span{background:var(--steel);color:var(--steel-ink)}
.seg input:focus-visible+span{outline:3px solid var(--amber)}
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pipe li{display:grid;gap:4px;font-size:.74rem;color:var(--muted);font-weight:600}
.pipe i{height:6px;border-radius:4px;background:var(--line)}
.pipe li.on i{background:var(--ok)}.pipe li.on{color:var(--ink)}.pipe li.bad i{background:var(--crit)}
.paybar{display:flex;height:14px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.paybar .pb-paid{background:var(--ok)}.paybar .pb-fly{background:var(--amber)}
.fund{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--sunk)}
.fund-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fund-opts button{display:grid;gap:2px;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.fund-opts button[aria-pressed="true"]{border:2px solid var(--steel);background:var(--sky)}
.escrow{display:grid;gap:10px;counter-reset:e;padding:0;margin:0;list-style:none}
@media (min-width:860px){.escrow{grid-template-columns:repeat(5,1fr)}}
.escrow li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;position:relative}
.escrow li::before{counter-increment:e;content:counter(e);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--sand);color:var(--warn)}
.escrow li:last-child::before{background:var(--mint);color:var(--ok)}
.escrow b{font-family:var(--display);font-size:1.15rem}
.mk-stock{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;background:var(--sunk)}.mk-stock.bad{background:var(--rose);color:var(--rose-ink)}

.cam{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--sunk);border:1px dashed var(--line)}
.cam-btn{justify-self:start;cursor:pointer}
.ph.shot{cursor:default;position:relative}
.ph .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;cursor:pointer}
.vb{position:absolute;left:5px;bottom:5px;padding:1px 7px;border-radius:999px;font-size:.68rem;font-weight:700;background:rgba(10,18,26,.7);color:#fff}
.vb.ok{background:#2c7a4b}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
const S={db:null,assets:null,downloads:null,mode:"loading",canWrite:true,projects:[],logs:[],reports:[],updates:[],expenses:[],requests:[],matreqs:[],stock:[],milestones:[],
  pid:null,view:"home",shots:[],tab:{developer:"overview",engineer:"today",investor:"overview"},open:{},loaded:{},slow:false,busy:false,
  demo:{i:0,play:false},seen:new Set(),counted:new Set(),home:{step:0,projects:1,annual:false,phase:7,auto:true},onb:{step:0,d:{floors:2,phase:0,team:[],annual:false}},draft:{sel:[],extra:[],title:"",briefing:"",next:"",budget:false,fromReport:null}};
const ROLE_LABEL={developer:"Developer",engineer:"Site Engineer",investor:"Investor"};

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const naira=n=>"₦"+Math.round(+n||0).toLocaleString("en-NG");
const nairaS=n=>{n=+n||0;const f=(x,s)=>"₦"+(Math.round(x*10)/10).toLocaleString("en-NG")+s;return n>=1e9?f(n/1e9,"bn"):n>=1e6?f(n/1e6,"m"):naira(n);};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}const d=new Date(s);return isNaN(d)?null:d;};
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";};
const fmtS=s=>{const d=parseD(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";};
const ordinal=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
const levelName=k=>k===0?"Ground floor":ordinal(k)+" floor";
function weekOf(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));const fri=new Date(d);fri.setDate(d.getDate()+4);fri.setHours(18,0,0,0);return {mon:d,fri,key:ymd(d)};}
function daysSince(s){const d=parseD(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);return Math.round((t-x)/864e5);}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const src=p=>p.url||("/_blob/"+p.id);

/* ---------- Nigerian construction stage template ---------- */
function stagesFor(p){
  const floors=Math.max(0,Math.min(30,parseInt(p.floors,10)||0)),st=[];
  const add=(id,group,name,weight,items)=>st.push({id,group,name,weight,items:items.map((l,i)=>({id:id+"."+i,label:l}))});
  add("pre","Pre-construction","Site inspection, surveys & approvals",4,["Site inspection & title/survey plan checked","Topographic survey","Soil investigation (geotechnical test)","Architectural, structural & M&E drawings approved","Building permit obtained (LASPPPA)","Site clearing & hoarding","Site office, store & water source set up","Mobilisation of workers & equipment"]);
  add("set","Setting out","Setting out",2,["Profile boards erected","Building lines & grid pegged to drawings","Diagonals and levels checked","Setting-out approved by engineer / LASBCA stage inspection"]);
  add("fdn","Foundation","Foundation & substructure",12,["Excavation of trenches / pits to depth","Blinding (lean concrete)","Foundation reinforcement fixed & inspected","Foundation concrete cast (strip / pad / raft)","Blockwork to DPC level (German floor)","Anti-termite treatment","Backfilling & compaction","Damp-proof membrane laid","Oversite concrete (ground floor slab)","Foundation stage certification"]);
  const lv=floors+1,w=30/lv;
  for(let k=0;k<lv;k++){const nm=levelName(k);
    if(k<floors)add("lv"+k,"Frame",nm+" walls & "+levelName(k+1)+" slab",w,["Columns reinforced & cast","Blockwork to lintel level","Lintels cast","Blockwork to beam level","Electrical & plumbing conduits laid before decking","Beam & slab formwork erected","Slab reinforcement inspected by engineer","Slab cast (decking) & curing","Formwork struck"]);
    else add("lv"+k,"Frame",(floors?nm+" walls":"Walls")+" to roof level",w,["Columns reinforced & cast","Blockwork to lintel level","Lintels cast","Blockwork to roof beam level","Roof / ring beam cast"]);}
  add("roof","Roofing","Roofing",8,["Wall plate fixed","Parapet / gable walls","Roof trusses & carcassing (treated timber or steel)","Fascia board fixed","Roof covering (long-span aluminium / stone-coated)","Gutters & downpipes","Roof stage inspection"]);
  add("me1","M&E first fix","M&E first fix (rough-in)",8,["Chasing for electrical conduits","Conduits & cable pulling","Plumbing supply pipes (hot & cold)","Waste & soil pipes","AC copper piping & drain lines","Septic tank / bio-digester & soakaway","Borehole, pumping & overhead tank stand"]);
  add("pls","Plastering","Frames, plastering & screeding",8,["Door & window frames fixed","Internal plastering","External rendering","Floor screeding","Ceiling framing (POP / PVC)"]);
  add("fin","Finishes","Finishes, tiling & joinery",14,["Floor & wall tiling","Ceiling finish (POP / PVC)","Painting — undercoats","Doors hung & ironmongery","Windows glazed (aluminium / casement)","Kitchen cabinets & worktops","Wardrobes & built-in furniture","Staircase & balcony railings"]);
  add("me2","M&E second fix","M&E second fix & fittings",7,["Sockets, switches & light fittings","Distribution board & meter connection","Sanitary fittings (WC, basin, shower, sink)","Water heaters","Generator / inverter & changeover","Water treatment & pumps","Fire alarm & extinguishers","Testing & commissioning"]);
  add("ext","External works","External works",4,["Perimeter fence & gate","Gatehouse","External drainage","Driveway & walkways (stamped concrete / interlocking paving)","Landscaping","External lighting"]);
  add("hnd","Handover","Snagging & handover",3,["Snag list compiled","Snags fixed","Final paint coat & cleaning","Certificate of Completion & Fitness for Habitation (LASBCA)","Handover, keys & manuals"]);
  return st;
}
function progress(p){
  const stages=stagesFor(p),c=p.checks||{};let tw=0,acc=0,current=null,next=null;
  stages.forEach(s=>{const d=s.items.filter(i=>c[i.id]).length;s.done=d;s.pct=d/s.items.length;s.status=s.pct>=1?"done":d>0?"active":"todo";tw+=s.weight;acc+=s.weight*s.pct;});
  let ci=-1;stages.forEach((s,i)=>{if(s.status==="active")ci=i;});if(ci<0)ci=stages.findIndex(s=>s.pct<1);current=ci>=0?stages[ci]:null;next=ci>=0?stages.slice(ci+1).find(s=>s.status==="todo")||stages.slice(ci+1).find(s=>s.pct<1)||null:null;
  const map=new Map();stages.forEach(s=>{if(!map.has(s.group))map.set(s.group,{name:s.group,w:0,a:0});const g=map.get(s.group);g.w+=s.weight;g.a+=s.weight*s.pct;});
  const phases=[...map.values()].map(g=>{const pct=g.a/g.w;return {name:g.name,pct,status:pct>=.999?"done":pct>0?"active":"todo"};});
  return {stages,overall:tw?acc/tw:0,current,next,phases};
}

/* ---------- data layer ---------- */
const queues={};
function queue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(onErr);return queues[key];}
function onErr(e){
  if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("You can view this project but not change it.");}
  else if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete old entries to add more.");
  else toast("That didn't save. Check your connection and try again.");
  render();
}
const store={
  async add(col,data){if(S.db){await S.db.collection(col).add(data);return;}S[col].push({id:"m"+Math.random().toString(36).slice(2),...data});render();},
  async set(col,id,data){if(S.db)return queue(col+"/"+id,()=>S.db.collection(col).doc(id).set(data));const i=S[col].findIndex(x=>x.id===id),r={id,...data};if(i<0)S[col].push(r);else S[col][i]=r;render();},
  async update(col,id,data){if(S.db)return queue(col+"/"+id,()=>S.db.collection(col).doc(id).update(data));const r=S[col].find(x=>x.id===id);if(!r)return;for(const k in data){if(data[k]&&typeof data[k]==="object"&&!Array.isArray(data[k]))r[k]={...(r[k]||{}),...data[k]};else r[k]=data[k];}render();},
  async del(col,id){if(S.db)return queue(col+"/"+id,()=>S.db.collection(col).doc(id).delete());S[col]=S[col].filter(x=>x.id!==id);render();}
};
async function uploadFile(file){
  if(S.assets){const r=await S.assets.upload(file);return {id:r.id,url:r.url,takenAt:file.lastModified?new Date(file.lastModified).toISOString():null};}
  return {id:"local-"+Math.random().toString(36).slice(2),url:URL.createObjectURL(file)};
}
function subscribe(col,q){
  q.onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));if(!snap.metadata.fromCache)S.loaded[col]=true;pickProject();render();},
    err=>{S.loaded[col]=true;if(err&&err.code!=="revoked")toast("Couldn't load "+col+".");render();});
}
function pickProject(){if(!S.projects.length){S.pid=null;return;}if(!S.projects.find(p=>p.id===S.pid)){const s=ls.get("st.pid");S.pid=(S.projects.find(p=>p.id===s)||S.projects[0]).id;}}

/* ---------- derived ---------- */
const P=()=>S.projects.find(p=>p.id===S.pid);
const byDateDesc=(a,b)=>(b.date||b.createdAt||"").localeCompare(a.date||a.createdAt||"")||(b.createdAt||"").localeCompare(a.createdAt||"");
const logsOf=pid=>S.logs.filter(l=>l.pid===pid).sort(byDateDesc);
const reportsOf=pid=>S.reports.filter(r=>r.pid===pid).sort((a,b)=>(b.weekStart||"").localeCompare(a.weekStart||""));
const updatesOf=pid=>S.updates.filter(u=>u.pid===pid).sort(byDateDesc);
const expOf=pid=>S.expenses.filter(e=>e.pid===pid).sort(byDateDesc);
const stageName=(p,id)=>{const s=stagesFor(p).find(x=>x.id===id);return s?s.name:"General";};
function sitePhotos(pid){const seen=new Set(),out=[];logsOf(pid).forEach(l=>(l.photos||[]).forEach(ph=>{if(seen.has(ph.id))return;seen.add(ph.id);out.push({...ph,cap:fmtS(l.date)+" · "+(l.by||"Site")});}));return out;}
function weekStatus(pid){const w=weekOf(new Date()),r=reportsOf(pid).find(x=>x.weekStart===w.key),now=new Date();return {w,report:r,left:Math.ceil((w.fri-now)/864e5),late:!r&&now>w.fri};}

/* ---------- small pieces ---------- */
const bar=(pct,cls)=>`<div class="bar ${cls||""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct*100)}"><i style="width:${Math.max(0,Math.min(100,pct*100)).toFixed(1)}%"></i></div>`;
function ring(pct,size){size=size||132;const r=52,c=2*Math.PI*r,v=Math.max(0,Math.min(1,pct));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 128 128" role="img" aria-label="${Math.round(v*100)} percent complete"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--steel)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 64 64)"/><text x="64" y="72" text-anchor="middle" font-size="30">${Math.round(v*100)}%</text></svg>`;}
function phaseStrip(pr){let ci=-1;pr.phases.forEach((x,i)=>{if(x.status==="active")ci=i;});if(ci<0)ci=pr.phases.findIndex(x=>x.status!=="done");const cur=ci>=0?pr.phases[ci]:null;
  return `<div style="display:grid;gap:6px"><div class="phases" aria-hidden="true">${pr.phases.map(x=>`<i class="${x.status}" title="${esc(x.name)}"></i>`).join("")}</div>
  <div class="ph-cap"><span>${cur?`Phase ${ci+1} of ${pr.phases.length}: <b style="color:var(--ink)">${esc(cur.name)}</b>`:"All phases complete"}</span><span class="num">${Math.round(pr.overall*100)}% overall</span></div></div>`;}
const photoGrid=(list,lg)=>list&&list.length?`<div class="photos ${lg?"lg":""}">${list.map(p=>`<button type="button" class="ph" data-act="photo" data-src="${esc(src(p))}" data-cap="${esc(p.cap||"")}"><img src="${esc(src(p))}" alt="Site photo" loading="lazy">${vBadge(p)}</button>`).join("")}</div>`:"";
function logHTML(p,l){
  return `<article class="log"><div class="log-h"><b>${esc(fmtD(l.date))}</b><span class="pill">${esc(stageName(p,l.stage))}</span>${l.weather?`<span class="pill">${esc(l.weather)}</span>`:""}${+l.workers?`<span class="pill num">${esc(l.workers)} workers</span>`:""}</div>
  <p>${esc(l.work)}</p>${l.issues?`<div class="issue"><b>Issue:</b> ${esc(l.issues)}</div>`:""}${photoGrid(l.photos)}<p class="small muted">By ${esc(l.by||"Site engineer")}</p></article>`;
}
function stageList(p){
  const pr=progress(p);let g="";
  return `<div class="stages">${pr.stages.map(s=>{
    let head="";if(s.group!==g){g=s.group;head=`<div class="grp">${esc(g)}</div>`;}
    const open=S.open[s.id]??(pr.current&&pr.current.id===s.id);
    const pill=s.status==="done"?`<span class="pill ok">Done</span>`:s.status==="active"?`<span class="pill active">In progress</span>`:`<span class="pill">Not started</span>`;
    return head+`<div class="stage ${s.status}"><button type="button" class="stage-h" data-act="toggle-stage" data-id="${s.id}" aria-expanded="${open?"true":"false"}"><span><b>${esc(s.name)}</b> <span class="small muted num">${s.done}/${s.items.length}</span></span>${pill}${bar(s.pct)}</button>
    ${open?`<ul class="checks">${s.items.map(i=>{const on=!!(p.checks||{})[i.id];return `<li><label><input type="checkbox" data-act="check" data-id="${i.id}" ${on?"checked":""} ${S.canWrite?"":"disabled"}><span class="${on?"done-t":""}">${esc(i.label)}</span></label></li>`;}).join("")}</ul>`:""}</div>`;}).join("")}</div>`;
}
function engReportHTML(p,r,forDev){
  return `<div class="rep"><div class="card-h"><b>Week of ${esc(fmtS(r.weekStart))} – ${esc(fmtS(r.weekEnd))}</b>${r.status==="used"?`<span class="pill ok">Sent to investor</span>`:`<span class="pill active">New</span>`}</div>
  <p class="small muted">From ${esc(r.by||"Site engineer")} · <span class="num">${r.logCount||0}</span> daily updates · avg <span class="num">${r.workersAvg||0}</span> workers</p>
  ${r.summary?`<p>${esc(r.summary)}</p>`:""}${r.next?`<p class="small"><b>Next week:</b> ${esc(r.next)}</p>`:""}
  ${r.issues&&r.issues.length?`<div class="small"><b>Issues:</b><ul>${r.issues.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`:""}
  ${photoGrid(r.photos)}
  ${forDev&&S.canWrite?`<div><button class="btn sm pri" data-act="use-report" data-id="${r.id}">Turn into investor update</button></div>`:""}</div>`;
}

/* ---------- HOME ---------- */
const ICON={
  eng:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h20"/><path d="M4 18v-2a8 8 0 0 1 16 0v2"/><path d="M10 8V5h4v3"/></svg>`,
  dev:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01"/></svg>`,
  inv:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>`,
  cam:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg>`
};
const BLUEPRINT=`<svg class="bp" viewBox="0 0 640 440" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
  <g class="dr" stroke-dasharray="4 4" opacity=".55"><line pathLength="1" x1="120" y1="58" x2="120" y2="410"/><line pathLength="1" x1="250" y1="58" x2="250" y2="410"/><line pathLength="1" x1="380" y1="58" x2="380" y2="410"/></g>
  <g class="dr"><circle pathLength="1" cx="120" cy="44" r="13"/><circle pathLength="1" cx="250" cy="44" r="13"/><circle pathLength="1" cx="380" cy="44" r="13"/></g>
  <g class="tx" fill="currentColor" stroke="none" font-family="IBM Plex Mono, monospace" font-size="12" text-anchor="middle"><text x="120" y="48">A</text><text x="250" y="48">B</text><text x="380" y="48">C</text></g>
  <g class="dr"><line pathLength="1" x1="30" y1="380" x2="620" y2="380" stroke-width="2"/>
    <rect pathLength="1" x="120" y="170" width="260" height="210" stroke-width="2"/>
    <line pathLength="1" x1="120" y1="240" x2="380" y2="240"/><line pathLength="1" x1="120" y1="310" x2="380" y2="310"/>
    <polyline pathLength="1" points="104,172 250,112 396,172" stroke-width="2"/>
    ${[0,1,2].map(f=>[145,205,305].map(x=>`<rect pathLength="1" x="${x}" y="${188+f*70}" width="${x===205?32:44}" height="34"/>`).join("")).join("")}
    <rect pathLength="1" x="232" y="326" width="38" height="54"/>
    <line pathLength="1" x1="396" y1="150" x2="396" y2="380"/><line pathLength="1" x1="428" y1="150" x2="428" y2="380"/>
    ${[170,205,240,275,310,345].map(y=>`<line pathLength="1" x1="396" y1="${y}" x2="428" y2="${y}"/>`).join("")}
    <polyline pathLength="1" points="396,380 428,345 396,310 428,275 396,240 428,205 396,170" opacity=".7"/>
    <line pathLength="1" x1="500" y1="40" x2="500" y2="380"/><line pathLength="1" x1="520" y1="40" x2="520" y2="380"/>
    <polyline pathLength="1" points="500,380 520,350 500,320 520,290 500,260 520,230 500,200 520,170 500,140 520,110 500,80 520,50" opacity=".7"/>
    <line pathLength="1" x1="430" y1="40" x2="630" y2="40" stroke-width="2"/><line pathLength="1" x1="430" y1="52" x2="630" y2="52"/>

/* ---------- home interactivity ---------- */
let homeTimers=[];
function clearHomeTimers(){homeTimers.forEach(clearInterval);homeTimers=[];}
const reduce=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function afterRender(){
  clearHomeTimers();
  if(S.view==="home"){
    let fi=0;const fe=document.getElementById("feed");
    if(fe&&!reduce())homeTimers.push(setInterval(()=>{fi=(fi+1)%FEED.length;fe.classList.remove("in");void fe.offsetWidth;fe.textContent=FEED[fi];fe.classList.add("in");},3200));
    if(S.home.auto&&!reduce())homeTimers.push(setInterval(()=>{if(!S.home.auto)return;S.home.step=(S.home.step+1)%STEPS.length;const y=window.scrollY;render();window.scrollTo(0,y);},7000));
    if("IntersectionObserver" in window&&!reduce()){
      const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("pop");S.seen.add(+e.target.dataset.ri);io.unobserve(e.target);}}),{threshold:.15});
      document.querySelectorAll(".reveal").forEach((el,i)=>{el.dataset.ri=i;if(!S.seen.has(i))io.observe(el);});
      const io2=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io2.unobserve(e.target);const el=e.target,to=+el.dataset.count;if(S.counted.has(to+el.nextElementSibling.textContent))return;S.counted.add(to+el.nextElementSibling.textContent);let s=null;const f=t=>{s=s||t;const k=Math.min(1,(t-s)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);};requestAnimationFrame(f);}),{threshold:.4});
      document.querySelectorAll("[data-count]").forEach(el=>io2.observe(el));
    }
  }
  if(S.view==="demo"&&S.demo.play&&!reduce())homeTimers.push(setInterval(()=>{if(S.demo.i<DEMO.length-1){S.demo.i++;render();}else{S.demo.play=false;render();}},6000));
}

    if(upAgo==null||upAgo>7)todo.push(["",upAgo==null?"Your investor hasn't had an update yet":`Last investor update was ${upAgo} days ago`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="investor">Create update</button>`]);
    {const pr2=reqOf(p.id).filter(r=>r.status==="pending");if(pr2.length)todo.push(["",`${pr2.length} material request${pr2.length>1?"s":""} waiting for approval`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="materials">Review</button>`]);}

    if(p.payMode==="milestone")msOf(p.id).forEach(m=>{if(m.status==="pending"&&phasePct(p,m.phase)>=.999)todo.push(["ok",`"${esc(m.name)}" is ready. Request release of ${naira(m.amount)}`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);if(m.status==="requested")todo.push(["",`Record verification for "${esc(m.name)}"`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);if(m.status==="approved")todo.push(["ok",`Investor approved "${esc(m.name)}". Confirm when the money arrives`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);if(m.status==="disputed")todo.push(["crit",`Investor disputed "${esc(m.name)}"`,`<button class="btn sm pri" data-act="tab" data-role="developer" data-tab="payments">Open</button>`]);});

function engView(p){
  const pr=progress(p),ws=weekStatus(p.id),me=ls.get("st.name")||"",wlogs=logsOf(p.id).filter(l=>l.date>=ws.w.key);
  const tabs=[["today","Today"],["weekly","Weekly report",ws.report?0:(ws.late?"!":0)],["materials","Materials"],["stages","Checklist"],["history","History"]];
  const t=S.tab.engineer;let body="";
  let ban;
  if(ws.report)ban=`<div class="banner done"><div><strong>Weekly report sent</strong><span class="small">Thanks. The developer has it.</span></div></div>`;
  else if(ws.late)ban=`<div class="banner late"><div><strong>Weekly report overdue</strong><span class="small">It was due Friday ${esc(fmtS(ymd(ws.w.fri)))}.</span></div><button class="btn amber" data-act="tab" data-role="engineer" data-tab="weekly">Write it now</button></div>`;
  else ban=`<div class="banner due"><div><strong>Weekly report due Friday ${esc(fmtS(ymd(ws.w.fri)))}</strong><span class="small">${ws.left<=0?"Due today":ws.left+" day"+(ws.left===1?"":"s")+" left"} · ${wlogs.length} update${wlogs.length===1?"":"s"} this week</span></div>${t!=="weekly"?`<button class="btn amber" data-act="tab" data-role="engineer" data-tab="weekly">Write report</button>`:""}</div>`;
  if(t==="today"){
    const ob=outbox.get().filter(x=>x.pid===p.id),lastMine=logsOf(p.id).find(l=>l.by===me&&l.date===ymd(new Date()));
    body=ban+(ob.length?`<div class="banner due"><div><strong>${ob.length} update${ob.length>1?"s":""} waiting for signal</strong><span class="small">Saved on this phone. They post automatically when you're back online.</span></div><button class="btn" data-act="flush">Try now</button></div>`:"")
      +(lastMine?`<div class="banner done"><div><strong>Today's update is posted</strong><span class="small">${esc(lastMine.work.slice(0,90))}</span></div>${waLink(`Site update, ${p.name} (${fmtS(lastMine.date)}): ${lastMine.work}${lastMine.issues?" Issue: "+lastMine.issues:""} Workers: ${lastMine.workers}. Photos on TrailConstruct.`,"Send to developer")}</div>`:"")
      +`<section class="card"><div><h2>Post today's update</h2><p class="small muted">${esc(p.name)} · now on ${esc(pr.current?pr.current.name:"handover")} · drafts save on this phone as you type</p></div>
      ${S.canWrite?`<form id="log-form">
        <div class="row"><label class="f" for="lg-date">Date<input type="date" id="lg-date" value="${ymd(new Date())}" required></label>
        <label class="f" for="lg-stage">Stage<select id="lg-stage">${pr.stages.map(s=>`<option value="${s.id}" ${pr.current&&pr.current.id===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label></div>
        <label class="f" for="lg-work">Work done today<textarea id="lg-work" required placeholder="e.g. Tiled master bedroom and landing, Block A">${esc(logDraft().work||"")}</textarea></label>
        <div class="row"><label class="f" for="lg-workers">Workers on site<input type="number" id="lg-workers" min="0" step="1" inputmode="numeric" value="${esc(logDraft().workers||"")}"></label>
        <label class="f" for="lg-weather">Weather<select id="lg-weather"><option>Sunny</option><option>Cloudy</option><option>Light rain</option><option>Heavy rain (work stopped)</option></select></label></div>
        <label class="f" for="lg-issues">Issues or delays (optional)<input type="text" id="lg-issues" placeholder="e.g. Waiting on sanitary fittings delivery" value="${esc(logDraft().issues||"")}"></label>
        ${S.assets||S.mode==="memory"?`<div class="cam"><label class="btn amber cam-btn" for="lg-cam">${ICON.cam} Take site photo</label><input type="file" id="lg-cam" accept="image/*" capture="environment" class="sr"><p class="small muted">Photos must be taken live${p.siteLat!=null&&p.siteLat!==""?`, within ${+p.siteRadius||200} m of the site`:""}. Each one is stamped with the date, time and GPS location.</p><div id="shots"></div></div>`:""}
        <label class="f" for="lg-by">Your name<input type="text" id="lg-by" value="${esc(me)}" placeholder="e.g. Eng. Wale" required></label>
        <div><button class="btn pri" type="submit" ${S.busy?"disabled":""}>${S.busy?esc(S.busy):"Post update"}</button></div></form>`:`<div class="empty">You have view access only.</div>`}</section>`;
  }
  if(t==="weekly"){
    const avg=wlogs.length?Math.round(wlogs.reduce((a,l)=>a+(+l.workers||0),0)/wlogs.length):0;
    body=ban+(ws.report?`<section class="card"><h2>This week's report</h2>${engReportHTML(p,ws.report,false)}</section>`:`<section class="card"><h2>Weekly report</h2>
      <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b class="num">${wlogs.length}</b><span>Updates</span></div><div class="stat"><b class="num">${avg}</b><span>Avg workers</span></div><div class="stat"><b class="num">${wlogs.reduce((a,l)=>a+(l.photos||[]).length,0)}</b><span>Photos</span></div></div>
      ${S.canWrite?`<form id="rep-form"><label class="f" for="rp-sum">Summary of the week<textarea id="rp-sum" required placeholder="What got done this week"></textarea></label>
      <label class="f" for="rp-next">Plan for next week<textarea id="rp-next" style="min-height:60px"></textarea></label>
      <p class="small muted">This week's daily updates, photos and issues are attached automatically.</p><div><button class="btn pri" type="submit">Send to developer</button></div></form>`:""}</section>`);
  }
  if(t==="materials")body=materialsView(p,"engineer");
  if(t==="stages")body=`<section class="card"><div class="card-h"><h2>Stage checklist</h2><span class="small muted">Tick items as they're finished</span></div>${stageList(p)}</section>`;
  if(t==="history"){const logs=logsOf(p.id);body=`<section class="card"><h2>All updates</h2>${logs.length?`<div class="list">${logs.slice(0,30).map(l=>logHTML(p,l)).join("")}</div>`:`<div class="empty">No updates yet.</div>`}</section>`;}
  return shell("engineer",tabs,body,true);
}

/* ---------- WhatsApp, materials, payments ---------- */
const WA_ICON=`<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg>`;
const waLink=(text,label)=>`<a class="btn sm wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${WA_ICON}${esc(label||"WhatsApp")}</a>`;

const reqOf=pid=>S.matreqs.filter(r=>r.pid===pid).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
const movesOf=pid=>S.stock.filter(r=>r.pid===pid).sort(byDateDesc);
const REQ_PILL={pending:["active","Waiting for approval"],approved:["ok","Approved"],rejected:["crit","Declined"],delivered:["ok","Delivered"]};
function stockRows(pid){
  const m=new Map();movesOf(pid).forEach(x=>{const k=(x.item||"").trim().toLowerCase();if(!k)return;if(!m.has(k))m.set(k,{item:x.item.trim(),unit:x.unit||"",inn:0,out:0});const r=m.get(k);if(x.type==="out")r.out+=+x.qty||0;else r.inn+=+x.qty||0;});
  return [...m.values()].map(r=>{const bal=r.inn-r.out;return {...r,bal,flag:bal<0?"crit":r.inn&&bal<=r.inn*.1?"low":""};}).sort((a,b)=>(a.flag==="crit"?-1:0)-(b.flag==="crit"?-1:0)||a.item.localeCompare(b.item));
}
function stockTable(pid){
  const rows=stockRows(pid);
  if(!rows.length)return `<div class="empty">No store records yet. Deliveries and usage logged on site appear here.</div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th class="r">In</th><th class="r">Used</th><th class="r">Balance</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.flag}"><td>${esc(r.item)}</td><td class="r num">${r.inn} ${esc(r.unit)}</td><td class="r num">${r.out}</td><td class="r num"><b>${r.bal}</b></td><td>${r.flag==="crit"?`<span class="pill crit">Used more than delivered</span>`:r.flag==="low"?`<span class="pill active">Running low</span>`:""}</td></tr>`).join("")}</tbody></table></div>`;
}
function reqCard(p,r,role){
  const [c,l]=REQ_PILL[r.status]||["",r.status];
  return `<div class="req"><div class="card-h"><b>${esc(r.qty)} ${esc(r.unit)} · ${esc(r.item)}</b><span class="pill ${c}">${l}</span></div>
  <p class="small muted">${esc(r.by||"Site")} · ${esc(fmtS(r.createdAt))}${r.needBy?" · needed by "+esc(fmtS(r.needBy)):""}${r.cost?" · "+naira(r.cost):""}</p>${r.note?`<p class="small">${esc(r.note)}</p>`:""}
  ${role==="developer"&&S.canWrite&&r.status==="pending"?`<div class="req-act"><label class="sr" for="cost-${r.id}">Cost</label><input type="number" id="cost-${r.id}" min="0" placeholder="Cost ₦ (optional)"><button class="btn sm pri" data-act="req-approve" data-id="${r.id}">Approve</button><button class="btn sm" data-act="req-reject" data-id="${r.id}">Decline</button></div>`:""}
  ${role==="developer"&&S.canWrite&&r.status==="approved"?`<div class="actions"><button class="btn sm" data-act="req-delivered" data-id="${r.id}">Mark delivered to site</button></div>`:""}
  ${role==="engineer"&&r.status==="pending"?`<div class="actions">${waLink(`Hi, I've raised a material request on TrailConstruct for ${p.name}: ${r.qty} ${r.unit} ${r.item}${r.needBy?", needed by "+fmtS(r.needBy):""}. Please approve.`,"Nudge on WhatsApp")}</div>`:""}</div>`;
}
const UNITS=["bags","pcs","tonnes","trips","lengths","m²","m³","litres","rolls","sets"];
function materialsView(p,role){
  const reqs=reqOf(p.id),moves=movesOf(p.id),pend=reqs.filter(r=>r.status==="pending"),appr=reqs.filter(r=>r.status==="approved");
  const items=[...new Set([...moves.map(m=>m.item),...reqs.map(r=>r.item)].filter(Boolean))];
  const reqForm=`<form id="req-form"><div class="row"><label class="f" for="rq-item">Material<input type="text" id="rq-item" list="mat-list" required placeholder="e.g. Cement (Dangote 42.5)"></label><label class="f" for="rq-qty">Quantity<input type="number" id="rq-qty" min="0" step="any" required></label><label class="f" for="rq-unit">Unit<select id="rq-unit">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select></label></div>
    <div class="row"><label class="f" for="rq-need">Needed by<input type="date" id="rq-need"></label><label class="f" for="rq-note">Note (optional)<input type="text" id="rq-note" placeholder="e.g. For Block B plastering"></label></div><div><button class="btn pri" type="submit">Send request</button></div></form>`;
  const moveForm=`<form id="mv-form"><div class="seg" role="group" aria-label="Movement type"><label><input type="radio" name="mv-type" value="in" checked><span>Delivered to site</span></label><label><input type="radio" name="mv-type" value="out"><span>Used today</span></label></div>
    <div class="row"><label class="f" for="mv-item">Material<input type="text" id="mv-item" list="mat-list" required></label><label class="f" for="mv-qty">Quantity<input type="number" id="mv-qty" min="0" step="any" required></label><label class="f" for="mv-unit">Unit<select id="mv-unit">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select></label></div>
    <label class="f" for="mv-note">Note (optional)<input type="text" id="mv-note" placeholder="e.g. Waybill no. 2231, received by storekeeper"></label><div><button class="btn" type="submit">Save to store log</button></div></form>`;
  const dl=`<datalist id="mat-list">${items.map(i=>`<option value="${esc(i)}"></option>`).join("")}</datalist>`;
  const recent=moves.slice(0,10).map(m=>`<div class="exp"><span>${m.type==="out"?"Used":"Delivered"}: ${esc(m.qty)} ${esc(m.unit)} ${esc(m.item)}</span><span class="pill ${m.type==="out"?"":"ok"}">${m.type==="out"?"Out":"In"}</span><span class="small muted">${esc(fmtS(m.date))} · ${esc(m.by||"")}${m.note?" · "+esc(m.note):""}</span><span></span></div>`).join("");
  if(role==="engineer")return `${dl}<div class="grid2"><section class="card"><h2>Request materials</h2><p class="small muted">The developer approves it, so you don't have to chase on the phone.</p>${S.canWrite?reqForm:""}</section>
    <section class="card"><h2>Your requests</h2>${reqs.length?reqs.slice(0,12).map(r=>reqCard(p,r,role)).join(""):`<div class="empty">No requests yet.</div>`}</section></div>
    <div class="grid2"><section class="card"><h2>Site store log</h2><p class="small muted">Record every delivery and what was used. Gaps show up straight away.</p>${S.canWrite?moveForm:""}</section>
    <section class="card"><h2>Store balance</h2>${stockTable(p.id)}</section></div>`;
  return `${dl}<div class="grid2"><section class="card"><div class="card-h"><h2>Requests to approve</h2>${pend.length?`<span class="pill active">${pend.length} waiting</span>`:""}</div>${pend.length?pend.map(r=>reqCard(p,r,role)).join(""):`<div class="empty">Nothing waiting.</div>`}
    ${appr.length?`<h3 style="margin-top:6px">Approved, awaiting delivery</h3>${appr.map(r=>reqCard(p,r,role)).join("")}`:""}</section>
    <section class="card"><h2>Store balance</h2>${stockTable(p.id)}<p class="small muted">Balance = delivered − used, from the site store log. Red rows mean more was recorded as used than was ever delivered.</p></section></div>
    <section class="card"><h2>Recent store movements</h2>${recent?`<div>${recent}</div>`:`<div class="empty">No movements yet.</div>`}</section>
    <section class="card"><h2>Request history</h2>${reqs.filter(r=>r.status==="delivered"||r.status==="rejected").slice(0,10).map(r=>reqCard(p,r,role)).join("")||`<div class="empty">No completed requests yet.</div>`}</section>`;
}

/* milestone payments */
const msOf=pid=>S.milestones.filter(m=>m.pid===pid).sort((a,b)=>(a.order||0)-(b.order||0));
const MS={pending:["","Not due yet"],requested:["active","Awaiting verification"],verified:["active","Awaiting investor approval"],approved:["ok","Approved, releasing"],paid:["ok","Paid"],disputed:["crit","Disputed"]};
const MS_TEMPLATE=[["Foundation complete","Foundation",.20],["Frame complete","Frame",.30],["Roof on","Roofing",.15],["M&E rough-in and plastering","Plastering",.15],["Finishes complete","Finishes",.15],["Handover","Handover",.05]];
const phasePct=(p,name)=>{const x=progress(p).phases.find(q=>q.name===name);return x?x.pct:0;};
function msSummary(p){
  const ms=msOf(p.id),contract=+p.contractSum||ms.reduce((a,m)=>a+(+m.amount||0),0);
  const paid=ms.filter(m=>m.status==="paid").reduce((a,m)=>a+(+m.amount||0),0);
  const inflight=ms.filter(m=>["requested","verified","approved"].includes(m.status)).reduce((a,m)=>a+(+m.amount||0),0);
  return {ms,contract,paid,inflight,left:Math.max(0,contract-paid-inflight)};
}
function msPipe(m){const order=["requested","verified","approved","paid"],i=order.indexOf(m.status==="disputed"?"verified":m.status);
  return `<ol class="pipe">${["Requested","Verified","Approved","Paid"].map((l,k)=>`<li class="${k<=i?(m.status==="disputed"&&k===i?"bad":"on"):""}"><i></i><span>${l}</span></li>`).join("")}</ol>`;}
function msCard(p,m,role){
  const [c,l]=MS[m.status]||["",m.status],pct=phasePct(p,m.phase),ready=pct>=.999;
  let act="";
  if(S.canWrite){
    if(role==="developer"){
      if(m.status==="pending")act=ready?`<button class="btn sm pri" data-act="ms-request" data-id="${m.id}">Request release</button>`:`<span class="small muted">Unlocks when ${esc(m.phase)} is complete (${Math.round(pct*100)}% now)</span>${`<button class="link small" data-act="ms-del" data-id="${m.id}">Remove</button>`}`;
      if(m.status==="requested")act=`<button class="btn sm pri" data-act="ms-verify" data-id="${m.id}">Record verification</button>`;
      if(m.status==="verified")act=waLink(`Hi, the "${m.name}" milestone on ${p.name} has been independently verified. Please review and approve the release of ${naira(m.amount)} on TrailConstruct.`,"Ask investor to approve");
      if(m.status==="approved")act=`<button class="btn sm pri" data-act="ms-paid" data-id="${m.id}">Confirm payment received</button>`;
      if(m.status==="disputed")act=`<button class="btn sm" data-act="ms-resubmit" data-id="${m.id}">Resubmit for verification</button>`;
    }
    if(role==="investor"){
      if(m.status==="verified")act=`<button class="btn sm pri" data-act="ms-approve" data-id="${m.id}">Approve release</button><button class="btn sm" data-act="ms-dispute" data-id="${m.id}">Dispute</button>`;
    }
  }
  return `<div class="ms-card ${c}"><div class="card-h"><div><b>${esc(m.name)}</b><p class="small muted">${esc(m.phase)} phase · ${Math.round(pct*100)}% done</p></div><div style="text-align:right"><b class="num">${naira(m.amount)}</b><br><span class="pill ${c}">${l}</span></div></div>
  ${m.status!=="pending"?msPipe(m):""}
  ${m.verification?`<p class="small"><b>Verified by</b> ${esc(m.verification.by)}${m.verification.org?" ("+esc(m.verification.org)+")":""} on ${esc(fmtS(m.verification.date))}${m.verification.note?": "+esc(m.verification.note):""}</p>`:""}

const LIVE_MIN=30;
function parseLatLng(s){const m=String(s||"").match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);if(!m)return null;const lat=+m[1],lng=+m[2];return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null;}
function distM(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const fmtDist=m=>m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km";
async function readExif(file){
  try{
    const buf=await file.slice(0,512*1024).arrayBuffer(),v=new DataView(buf);
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};
    let off=2;
    while(off<v.byteLength-10){
      const mk=v.getUint16(off);off+=2;
      if((mk&0xFF00)!==0xFF00)break;
      const len=v.getUint16(off);
      if(mk===0xFFE1&&v.getUint32(off+2)===0x45786966)return parseTiff(v,off+8);
      off+=len;
    }
  }catch(e){}
  return {};
}
function parseTiff(v,t){
  const le=v.getUint16(t)===0x4949,g16=o=>v.getUint16(o,le),g32=o=>v.getUint32(o,le),out={};
  const ifd=o=>{const n=g16(o),tags={};for(let i=0;i<n;i++){const e=o+2+i*12;tags[g16(e)]={count:g32(e+4),vo:e+8};}return tags;};
  const rat=o=>{const d=g32(o+4);return d?g32(o)/d:0;};
  const str=tg=>{const o=tg.count>4?t+g32(tg.vo):tg.vo;let s="";for(let i=0;i<tg.count-1;i++)s+=String.fromCharCode(v.getUint8(o+i));return s;};
  const t0=ifd(t+g32(t+4));
  if(t0[0x8769]){const ex=ifd(t+g32(t0[0x8769].vo));if(ex[0x9003])out.dt=str(ex[0x9003]);}
  if(t0[0x8825]){const gp=ifd(t+g32(t0[0x8825].vo)),co=tg=>{const o=t+g32(tg.vo);return rat(o)+rat(o+8)/60+rat(o+16)/3600;};
    if(gp[2]&&gp[4]){let lat=co(gp[2]),lng=co(gp[4]);if(gp[1]&&String.fromCharCode(v.getUint8(gp[1].vo))==="S")lat=-lat;if(gp[3]&&String.fromCharCode(v.getUint8(gp[3].vo))==="W")lng=-lng;if(lat||lng)out.gps={lat,lng};}}
  return out;
}
function exifTime(dt){const m=String(dt||"").match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]):null;}
function stampPhoto(file,lines){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{const max=1600,s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);
      const fs=Math.max(16,Math.round(w/48)),bh=Math.round(fs*1.5*lines.length+fs);x.fillStyle="rgba(10,18,26,.72)";x.fillRect(0,h-bh,w,bh);x.fillStyle="#f0a500";x.fillRect(0,h-bh,Math.round(fs/3),bh);
      x.fillStyle="#ffffff";x.font=`600 ${fs}px "IBM Plex Sans",Arial,sans-serif`;lines.forEach((l,i)=>x.fillText(l,fs,h-bh+fs*1.35*(i+1)));
      c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error("stamp"));},"image/jpeg",.82);}catch(e){rej(e);}};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("load"));};im.src=u;});
}
async function checkShot(p,file){
  const ex=await readExif(file),now=Date.now();
  const taken=exifTime(ex.dt)||(file.lastModified?new Date(file.lastModified):null);
  const ageMin=taken?(now-taken.getTime())/60000:null;
  if(ageMin!=null&&ageMin>LIVE_MIN)return {ok:false,why:`This photo was taken ${ageMin>1440?Math.round(ageMin/1440)+" days":ageMin>90?Math.round(ageMin/60)+" hours":Math.round(ageMin)+" minutes"} ago. Take a new photo on site.`};
  const site=p.siteLat!=null&&p.siteLng!=null&&p.siteLat!==""?{lat:+p.siteLat,lng:+p.siteLng}:null,rad=+p.siteRadius||200;
  let v="nosite",dist=null;
  if(ex.gps&&site){dist=distM(ex.gps,site);if(dist>rad)return {ok:false,why:`This photo was taken ${fmtDist(dist)} from the site. Photos must be taken within ${rad} m of the site.`};v="onsite";}
  if(!ex.gps&&S.mode==="cf"){const d=await getDevicePos();if(d){ex.gps={lat:d.lat,lng:d.lng};ex.src="device";}}
  if(ex.gps&&site&&ex.src==="device"){dist=distM(ex.gps,site);if(dist>rad)return {ok:false,why:`You are ${fmtDist(dist)} from the site. Photos must be taken within ${rad} m of the site.`};v="onsite";}
  else if(!ex.gps){if(site&&p.strictGps)return {ok:false,why:"This photo has no location. Turn on location for your camera, then take it again."};v=site?"nogps":"nosite";}
  else if(v!=="onsite")v="gps";
  const when=new Date(taken||now),stampT=when.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const lines=[`TrailConstruct · ${p.name}`,`${stampT}${ex.gps?` · ${ex.gps.lat.toFixed(5)}, ${ex.gps.lng.toFixed(5)}`:""}`,v==="onsite"?`Verified on site (${fmtDist(dist)} from pin)`:v==="nogps"?"Location not recorded by camera":"Live photo"];
  const blob=await stampPhoto(file,lines);
  return {ok:true,blob,preview:URL.createObjectURL(blob),v,dist,gps:ex.gps||null,takenAt:when.toISOString()};
}
const VBADGE={onsite:["ok","On site"],nogps:["","No GPS"],nosite:["","Live"],gps:["","Live · GPS"]};
const vBadge=p=>p&&p.v&&VBADGE[p.v]?`<span class="vb ${VBADGE[p.v][0]}">${VBADGE[p.v][0]==="ok"?"✓ ":""}${VBADGE[p.v][1]}</span>`:"";

/* ---------- PDF report ---------- */
function loadImg(url){return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{try{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res({data:c.toDataURL("image/jpeg",.82),w:c.width,h:c.height});}catch(e){res(null);}};im.onerror=()=>res(null);im.src=url;});}
async function makePDF(p,u){
  if(!S.downloads){toast("Downloads aren't available here.");return;}
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast("The report tool didn't load. Check your connection and try again.");return;}
  toast("Preparing report…");
  const snap=u.snapshot||(()=>{const pr=progress(p);return {overall:pr.overall,current:pr.current?pr.current.name:"Completed",next:pr.next?pr.next.name:"Handover",phases:pr.phases.map(x=>({name:x.name,pct:x.pct}))};})();
  const doc=new J({unit:"mm",format:"a4"}),W=210,M=16,CW=W-2*M;let y=0;
  const need=h=>{if(y+h>282){doc.addPage();y=18;}};
  const txt=(t,size,style,color)=>{doc.setFont("helvetica",style||"normal");doc.setFontSize(size);doc.setTextColor(...(color||[21,32,42]));const lines=doc.splitTextToSize(String(t||""),CW);lines.forEach(l=>{need(size*.45);doc.text(l,M,y);y+=size*.45;});};
  doc.setFillColor(43,74,94);doc.rect(0,0,W,30,"F");doc.setFillColor(240,165,0);doc.rect(0,30,W,2,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("TrailConstruct",M,15);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text("Investor progress report · Every stage, on record.",M,22);doc.text(fmtD(u.date),W-M,22,{align:"right"});
  y=44;txt(p.name,18,"bold");y+=1;txt([p.location,p.units,+p.floors?"Ground + "+p.floors+" floors":""].filter(Boolean).join("  ·  "),10,"normal",[91,101,112]);y+=4;
  txt(u.title,13,"bold");y+=2;
  need(26);doc.setFillColor(246,247,243);doc.roundedRect(M,y,CW,24,3,3,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(24);doc.setTextColor(43,74,94);doc.text(Math.round(snap.overall*100)+"%",M+6,y+15);
  doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(91,101,112);doc.text("complete",M+6,y+20);
  doc.setTextColor(21,32,42);doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text("Now:",M+42,y+10);doc.text("Next:",M+42,y+17);
  doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(snap.current,CW-58)[0],M+54,y+10);doc.text(doc.splitTextToSize(snap.next,CW-58)[0],M+54,y+17);y+=32;
  txt("Briefing",12,"bold");y+=1;txt(u.briefing,10.5);y+=3;
  if(u.next){txt("What's next",12,"bold");y+=1;txt(u.next,10.5);y+=3;}
  txt("Progress by phase",12,"bold");y+=2;
  snap.phases.forEach(ph=>{need(7);doc.setFontSize(9.5);doc.setFont("helvetica","normal");doc.setTextColor(21,32,42);doc.text(ph.name,M,y+3.5);
    const bx=M+52,bw=CW-70;doc.setFillColor(223,226,219);doc.roundedRect(bx,y,bw,4.5,2,2,"F");
    if(ph.pct>0){doc.setFillColor(...(ph.pct>=.999?[44,122,75]:[240,165,0]));doc.roundedRect(bx,y,Math.max(4,bw*ph.pct),4.5,2,2,"F");}
    doc.text(Math.round(ph.pct*100)+"%",W-M,y+3.5,{align:"right"});y+=7;});
  y+=3;
  if(u.budget){txt("Budget",12,"bold");y+=1;txt(`${naira(u.budget.spent).replace("₦","NGN ")} spent of ${naira(u.budget.budget).replace("₦","NGN ")} (${u.budget.budget?Math.round(u.budget.spent/u.budget.budget*100):0}%)`,10.5);y+=3;}
  const ph=u.photos||[];
  if(ph.length){need(12);txt("Site photos",12,"bold");y+=2;const cw=(CW-6)/2,chh=cw*0.72;let col=0;
    for(const x of ph){const im=await loadImg(src(x));if(!im)continue;if(col===0)need(chh+8);
      const r=Math.min(cw/im.w,chh/im.h),w=im.w*r,h=im.h*r,xx=M+col*(cw+6)+(cw-w)/2;
      doc.addImage(im.data,"JPEG",xx,y+(chh-h)/2,w,h);if(x.cap){doc.setFontSize(8);doc.setTextColor(91,101,112);doc.text(x.cap,M+col*(cw+6),y+chh+4);}
      col++;if(col===2){col=0;y+=chh+8;}}
    if(col)y+=chh+8;}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(140,140,140);doc.text("TrailConstruct · "+p.name+" · Page "+i+" of "+n,W/2,292,{align:"center"});}
  const name=(p.name+"-"+(u.date||"report")).replace(/[^A-Za-z0-9-]+/g,"-")+".pdf";
  try{await S.downloads.save({filename:name,data:doc.output("blob")});}
  catch(e){if(e&&e.code!=="declined")toast("Couldn't save the report. Try again.");}
}

  if(act==="ms-verify"){const m=S.milestones.find(x=>x.id===t.dataset.id);if(m)verifyForm(m);return;}

    S.tab.developer="investor";render();window.scrollTo(0,0);return;}

    {const g=parseLatLng(v("pf-gps"));if(v("pf-gps").trim()&&!g){toast("Couldn't read that location. Use \"6.4561, 3.4318\" or a Google Maps link.");return;}data.siteLat=g?g.lat:"";data.siteLng=g?g.lng:"";}
    if(f.dataset.id)await store.update("projects",f.dataset.id,data);
    else{const nid="p-"+Date.now().toString(36);await store.set("projects",nid,{...data,checks:{},createdAt:new Date().toISOString()});S.pid=nid;ls.set("st.pid",nid);}
    closeModal();toast("Project saved.");render();return;
  }
  if(!p)return;

  if(f.id==="mv-form"){const type=(f.querySelector("input[name=mv-type]:checked")||{}).value||"in";await store.add("stock",{pid:p.id,item:v("mv-item").trim(),qty:+v("mv-qty")||0,unit:v("mv-unit"),type,note:v("mv-note").trim(),by:ls.get("st.name")||"Site",date:ymd(new Date()),createdAt:new Date().toISOString()});toast(type==="in"?"Delivery recorded.":"Usage recorded.");return;}
  if(f.id==="ms-form"){const n=msOf(p.id).length;await store.add("milestones",{pid:p.id,name:v("ms-name").trim(),phase:v("ms-phase"),amount:Math.max(0,+v("ms-amt")||0),order:n,status:"pending",createdAt:new Date().toISOString()});toast("Milestone added.");return;}
  if(f.id==="ver-form"){await store.update("milestones",f.dataset.id,{status:"verified",verification:{by:v("vf-by").trim(),org:v("vf-org").trim(),date:v("vf-date"),note:v("vf-note").trim()},verifiedAt:new Date().toISOString()});closeModal();toast("Verified. The investor can now approve.");return;}
  if(f.id==="dis-form"){await store.update("milestones",f.dataset.id,{status:"disputed",dispute:v("ds-note").trim()});closeModal();toast("Dispute sent to the developer.");return;}
  if(f.id==="paid-form"){await store.update("milestones",f.dataset.id,{status:"paid",payRef:v("pd-ref").trim(),paidAt:new Date().toISOString()});closeModal();toast("Payment confirmed.");return;}
  if(f.id==="exp-form"){await store.add("expenses",{pid:p.id,item:v("ex-item").trim(),amount:Math.max(0,+v("ex-amt")||0),stage:v("ex-stage"),date:v("ex-date")||ymd(new Date()),createdAt:new Date().toISOString()});toast("Expense added.");return;}
  if(f.id==="log-form"){
    if(S.busy)return;const by=v("lg-by").trim();ls.set("st.name",by);
    const files=S.shots.slice(0,8);
    const data={pid:p.id,date:v("lg-date"),stage:v("lg-stage"),work:v("lg-work").trim(),workers:Math.max(0,parseInt(v("lg-workers"),10)||0),weather:v("lg-weather"),issues:v("lg-issues").trim(),by,createdAt:new Date().toISOString(),photos:[]};
    if(!navigator.onLine){const q=outbox.get();q.push(data);outbox.set(q);ls.set("st.draft.log","{}");toast("No signal. Saved on this phone"+(files.length?" (photos need signal, add them later)":"")+". It will post when you're back online.");render();return;}
    try{for(let i=0;i<files.length;i++){S.busy="Uploading photo "+(i+1)+" of "+files.length+"…";render();const s=files[i],up=await uploadFile(new File([s.blob],"site-photo.jpg",{type:"image/jpeg",lastModified:Date.parse(s.takenAt)||Date.now()}));data.photos.push({...up,v:s.v,dist:s.dist,gps:s.gps,takenAt:s.takenAt});}
      S.busy="Posting…";render();await store.add("logs",data);ls.set("st.draft.log","{}");S.shots=[];S.busy=false;toast("Update posted.");render();}
    catch(err){S.busy=false;onErr(err);}return;
  }
  if(f.id==="rep-form"){
    const ws=weekOf(new Date()),wl=logsOf(p.id).filter(l=>l.date>=ws.key);
    await store.set("reports",p.id+"_"+ws.key,{pid:p.id,weekStart:ws.key,weekEnd:ymd(ws.fri),by:ls.get("st.name")||"Site engineer",summary:v("rp-sum").trim(),next:v("rp-next").trim(),
      logCount:wl.length,workersAvg:wl.length?Math.round(wl.reduce((a,l)=>a+(+l.workers||0),0)/wl.length):0,
      issues:wl.filter(l=>l.issues).map(l=>fmtS(l.date)+": "+l.issues),photos:wl.flatMap(l=>(l.photos||[]).map(x=>({...x,cap:fmtS(l.date)}))).slice(0,12),status:"new",createdAt:new Date().toISOString()});
    toast("Report sent to the developer.");return;
  }
  if(f.id==="upd-form"){
    saveDraftFields();const d=S.draft,pr=progress(p);
    const pool=[...d.extra,...sitePhotos(p.id)],photos=d.sel.map(id=>pool.find(x=>x.id===id)).filter(Boolean).map(x=>({id:x.id,url:x.url||"",cap:x.cap||""}));
    const exps=expOf(p.id),spent=exps.reduce((a,e)=>a+(+e.amount||0),0);
    const u={pid:p.id,title:d.title.trim()||"Progress update",briefing:d.briefing.trim(),next:d.next.trim(),date:ymd(new Date()),photos,by:p.client||"",
      snapshot:{overall:pr.overall,current:pr.current?pr.current.name:"Completed",next:pr.next?pr.next.name:"Handover",phases:pr.phases.map(x=>({name:x.name,pct:x.pct}))},
      budget:d.budget?{budget:+p.budget||0,spent}:null,createdAt:new Date().toISOString()};
    S.busy="Sending…";render();
    try{await store.add("updates",u);if(d.fromReport)await store.update("reports",d.fromReport,{status:"used"});
      for(const r of S.requests.filter(r=>r.pid===p.id&&!r.resolved))await store.update("requests",r.id,{resolved:true});
      S.draft={sel:[],extra:[],title:"",briefing:"",next:"",budget:false,fromReport:null};toast("Update sent to the investor.");}
    catch(err){onErr(err);}S.busy=false;render();return;
  }
});

if(["up-title","up-brief","up-next"].includes(e.target.id))saveDraftFields();});

/* ---------- preview data (only when shared storage is unavailable) ---------- */

  stagesFor({floors:2}).forEach(s=>{if(["pre","set","fdn","lv0","lv1","lv2","roof"].includes(s.id))s.items.forEach(i=>checks[i.id]=true);});["me1.0","me1.1","pls.0","pls.1","pls.2","pls.3","fin.0"].forEach(k=>checks[k]=true);
