  const coll=col=>({path:col,doc:id=>docRef(col,id||newId()),
    add:async data=>{const r=docRef(col,newId());await r.set(data);return r;},
    orderBy(){return this;},limit(){return this;},where(){return this;},
    onSnapshot(next){(subs[col]=subs[col]||[]).push(rows=>next({docs:rows.map(x=>({id:x.id,exists:true,data:()=>x.data})),size:rows.length,empty:!rows.length,metadata:{fromCache:false,hasPendingWrites:false}}));return ()=>{};}});
  return {collection:coll,doc:p=>{const [c,i]=p.split("/");return docRef(c,i);},pull,reset(){since=0;memSig="";for(const c in cache)delete cache[c];}};
}
const cfAssets={async upload(file,pid,meta){const m=meta||{},h={};if(m.takenAt)h["x-taken-at"]=m.takenAt;if(m.gps){h["x-lat"]=String(m.gps.lat);h["x-lng"]=String(m.gps.lng);}if(m.orig)h["x-orig-hash"]=m.orig;
  const d=await cfApi("POST","/api/upload?pid="+encodeURIComponent(pid||S.pid||""),null,file,h);return d;}};
const cfDownloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:"saved"};}};
const roleFor=pid=>((S.memberships||[]).find(m=>m.pid===pid)||{}).role||null;
async function cfAfterAuth(){
  const code=S.pendingInvite;
  if(code){try{const r=await cfApi("POST","/api/invites/accept",{code});S.pendingInvite=null;try{sessionStorage.removeItem("st.invite")}catch(e){}S.pid=r.pid;ls.set("st.pid",r.pid);toast("You've joined the project.");}catch(e){toast(e.message||"That invite link isn't valid any more.");S.pendingInvite=null;}}
  try{const d=await cfApi("GET","/api/me");S.admin=d.admin||null;S.memberships=d.memberships||S.memberships;}catch(e){}
  await S.db.pull();pickProject();
  // Admins land on the admin page when they came from the admin link, or when they have no projects of their own.
  if(code&&S.pid&&roleFor(S.pid)==="engineer"&&!ls.get("st.guided")){ls.set("st.guided","1");go("guide");return;}
  if(S.admin&&(S.afterLogin==="admin"||!(S.memberships||[]).length)){S.afterLogin=null;S.adm={};go("admin");return;}
  S.afterLogin=null;
  const role=S.pid?roleFor(S.pid):null;
  go(role||"developer");
}
function showErr(title,msg){modal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div><button class="btn pri" data-act="close">OK</button></div>`);}
function cfAuthView(){
  const inv=S.pendingInvite,mode=S.authMode||"in",back=`<p class="small" style="text-align:center"><button type="button" class="link" data-act="authmode-set" data-m="in">Back to sign in</button></p>`;
  if(mode==="forgot"||mode==="reset")return `<div class="auth"><div class="auth-box">
    <a class="brand" href="#home">${MARK}<span>Trail<span class="wm2">Construct</span></span></a>
    ${mode==="forgot"?`<h1 class="auth-h">Reset your password</h1><p class="small muted">Enter the email you signed up with. We'll send you a link to choose a new password.</p>
    <form id="forgot-form"><label class="f" for="fg-email">Email<input type="email" id="fg-email" required autocomplete="email"></label>
      <div><button class="btn pri" type="submit" ${S.busy?"disabled":""}>${S.busy?"Please wait…":"Send reset link"}</button></div></form>`
    :`<h1 class="auth-h">Choose a new password</h1><p class="small muted">Use at least 8 characters. You'll be signed out on your other devices.</p>
    <form id="reset-form"><label class="f" for="rs-pass">New password<input type="password" id="rs-pass" required minlength="8" autocomplete="new-password"></label>
      <label class="f" for="rs-pass2">Type it again<input type="password" id="rs-pass2" required minlength="8" autocomplete="new-password"></label>
      <div><button class="btn pri" type="submit" ${S.busy?"disabled":""}>${S.busy?"Please wait…":"Save new password"}</button></div></form>`}
    ${back}<a class="link small" href="#home">Back to home</a></div></div>`;
  return `<div class="auth"><div class="auth-box">
    <a class="brand" href="#home">${MARK}<span>Trail<span class="wm2">Construct</span></span></a>
    ${inv?`<p class="note">You've been invited to a project. ${mode==="in"?"Sign in":"Create your account"} to join it.</p>`:""}
    <div class="seg" role="group" aria-label="Sign in or create account"><label><input type="radio" name="am" value="in" data-act="authmode" ${mode==="in"?"checked":""}><span>Sign in</span></label><label><input type="radio" name="am" value="up" data-act="authmode" ${mode==="up"?"checked":""}><span>Create account</span></label></div>
    <form id="auth-form">
      ${mode==="up"?`<label class="f" for="au-name">Full name<input type="text" id="au-name" required autocomplete="name"></label>`:""}
      <label class="f" for="au-email">Email<input type="email" id="au-email" required autocomplete="email"></label>
      <label class="f" for="au-pass">Password<input type="password" id="au-pass" required minlength="8" autocomplete="${mode==="up"?"new-password":"current-password"}"></label>${mode==="up"?`<p class="small muted">By creating an account you agree to the <a href="#terms" target="_blank">Terms</a> and <a href="#privacy" target="_blank">Privacy policy</a>.</p>`:`<p class="small" style="margin:-4px 0 0;text-align:right"><button type="button" class="link" data-act="authmode-set" data-m="forgot">Forgot password?</button></p>`}
      <div><button class="btn pri" type="submit" ${S.busy?"disabled":""}>${S.busy?"Please wait…":mode==="up"?"Create account":"Sign in"}</button></div>
    </form>
    ${!inv?`<p class="small" style="text-align:center">Developer setting up a site? <a class="link" href="#signup">Start here</a></p>`:""}
    <a class="link small" href="#home">Back to home</a>
  </div></div>`;
}
function activitySection(p){
  const a=S.activity[p.id];
  if(!a){S.activity[p.id]={loading:true};cfApi("GET","/api/audit?pid="+encodeURIComponent(p.id)).then(d=>{S.activity[p.id]=d;render();}).catch(()=>{S.activity[p.id]={items:[]};render();});}
  const items=(a&&a.items)||[],n=S.activityMore?items.length:Math.min(items.length,12);
  const when=t=>new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  return `<section class="card"><div class="card-h"><h2>Activity</h2><button class="btn sm ghost" data-act="act-refresh">Refresh</button></div><p class="small muted" style="margin:0">Who did what on this project. Only developers can see this.</p>
    ${!a||a.loading?`<div class="empty">Loading…</div>`:!items.length?`<div class="empty">Nothing yet.</div>`:`<ul class="actlog">${items.slice(0,n).map(x=>`<li><span class="small muted num">${when(x.at)}</span><span><b>${esc(x.who||"Someone")}</b>${x.role?` <span class="small muted">(${esc(ROLE_LABEL[x.role]||x.role)})</span>`:""} ${esc(x.action)}</span></li>`).join("")}</ul>${items.length>n?`<div><button class="btn sm" data-act="act-more">Show all ${items.length}</button></div>`:""}`}</section>`;
}
function teamSection(p){
  const t=S.team[p.id];
  if(!t){cfApi("GET","/api/members?pid="+encodeURIComponent(p.id)).then(d=>{S.team[p.id]=d;render();}).catch(()=>{});return `<section class="card"><h2>Team</h2><div class="empty">Loading team…</div></section>`;}
  const link=c=>location.origin+"/?invite="+c;
  return `<section class="card"><h2>Team</h2>
    <div>${(t.members||[]).map(m=>`<div class="exp"><span>${esc(m.name||m.email)}${m.id===t.me?" (you)":""}</span><span class="pill ${m.role==="investor"?"ok":m.role==="engineer"?"active":""}">${ROLE_LABEL[m.role]||m.role}</span><span class="small muted">${esc(m.email)}</span><span>${m.id!==t.me?`<button class="btn sm ghost" data-act="rm-member" data-id="${esc(m.id)}" data-name="${esc(m.name||m.email)}">Remove</button>`:""}</span></div>`).join("")}</div>
    ${(t.invites||[]).length?`<h3>Pending invites</h3>${t.invites.map(i=>`<div class="exp"><span>${esc(i.name||i.email||"Invite")} · ${ROLE_LABEL[i.role]}</span><span class="actions">${waLink(`You've been invited to follow ${p.name} on TrailConstruct as ${ROLE_LABEL[i.role]}. Join here: ${link(i.code)}${i.role==="engineer"?`\n\nNew to it? 2-minute guide: ${location.origin}/#guide`:""}`,"Send")}<button class="btn sm" data-act="copy" data-text="${esc(link(i.code))}">Copy link</button><button class="btn sm ghost" data-act="rm-invite" data-id="${esc(i.code)}">Cancel</button></span><span class="small muted">${esc(i.email||"")}</span><span></span></div>`).join("")}<p class="small muted">Invite links work once and expire after 14 days.</p>`:""}
    <form id="inv-form"><h3>Invite someone</h3><div class="row"><label class="f" for="iv-name">Name<input type="text" id="iv-name" required></label><label class="f" for="iv-email">Email<input type="email" id="iv-email"></label><label class="f" for="iv-role">Role<select id="iv-role"><option value="engineer">Site engineer</option><option value="investor">Investor</option><option value="developer">Developer (full access)</option></select></label></div><div><button class="btn pri" type="submit">Create invite link</button></div></form>
  </section>`;
}
async function getDevicePos(){
  if(!navigator.geolocation)return null;
  return new Promise(res=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:60000}));
}
async function initCf(){
  let me;
  try{me=await fetch("/api/me",{credentials:"same-origin"});}catch(e){return false;}
  if(!me||(me.status!==200&&me.status!==401)||!(me.headers.get("content-type")||"").includes("json"))return false;
  S.mode="cf";try{const c=await (await fetch("/api/config")).json();S.mapsKey=c.mapsKey||"";S.cfg=c;}catch(e){}
  S.db=makeCfDb();S.assets=cfAssets;S.downloads=cfDownloads;S.team={};S.activity={};S.canWrite=true;
  const rm=location.hash.match(/^#reset-([a-f0-9]{64})$/);
  if(rm){S.resetToken=rm[1];S.authMode="reset";S.view="signin";history.replaceState(null,"",location.pathname+"#signin");}
  const q=new URLSearchParams(location.search).get("invite");
  if(q){S.pendingInvite=q;try{sessionStorage.setItem("st.invite",q)}catch(e){}history.replaceState(null,"",location.pathname+"#signin");S.view="signin";S.authMode="up";}
  else{try{S.pendingInvite=sessionStorage.getItem("st.invite")||null}catch(e){}}
  ["projects","logs","reports","updates","expenses","requests","matreqs","stock","milestones"].forEach(c=>subscribe(c,S.db.collection(c)));
  if(me.status===200){const d=await me.json();S.me=d.user;S.admin=d.admin||null;S.memberships=d.memberships||[];if(S.admin&&!S.memberships.length&&["developer","signin"].includes(S.view)){S.view="admin";history.replaceState(null,"","#admin");}await S.db.pull();if(S.pendingInvite){await cfAfterAuth();return true;}}
  else{S.me=null;S.loaded.projects=true;}
  setInterval(()=>{if(S.me&&document.visibilityState==="visible")S.db.pull();},20000);
  document.addEventListener("visibilitychange",()=>{if(S.me&&document.visibilityState==="visible")S.db.pull();});
  setTimeout(flushOutbox,2500);
  render();return true;
}


/* ---------- site address autocomplete (Google Places) + GPS pin ---------- */
let gmapsP=null;
function loadMaps(){
  if(!S.mapsKey)return Promise.resolve(null);
  if(gmapsP)return gmapsP;
  gmapsP=new Promise(res=>{window.__gmInit=()=>res(window.google&&google.maps?google.maps:null);
    const s=document.createElement("script");s.async=true;s.onerror=()=>res(null);
    s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(S.mapsKey)+"&v=weekly&loading=async&libraries=places&callback=__gmInit";
    document.head.appendChild(s);setTimeout(()=>res(window.google&&google.maps?google.maps:null),12000);});
  return gmapsP;
}
async function mountPlaces(holderId,onPick){
  const holder=document.getElementById(holderId);if(!holder||holder.dataset.ready)return;
  holder.dataset.ready="1";
  const maps=await loadMaps();if(!maps||!document.body.contains(holder)){holder.dataset.ready="";return;}
  try{
    const lib=await google.maps.importLibrary("places");
    const el=new lib.PlaceAutocompleteElement({includedRegionCodes:["ng"]});
    el.setAttribute("placeholder","Start typing the site address");
    const typed=holder.querySelector("input");if(typed&&typed.value)try{el.value=typed.value;}catch(e){}
    holder.innerHTML="";holder.appendChild(el);holder.classList.add("ac-live");
    const take=async place=>{await place.fetchFields({fields:["formattedAddress","displayName","location"]});const l=place.location;if(!l)return;onPick({address:place.formattedAddress||place.displayName||"",lat:+l.lat().toFixed(6),lng:+l.lng().toFixed(6)});};
    el.addEventListener("gmp-select",e=>{take(e.placePrediction.toPlace()).catch(()=>toast("Couldn't read that address. Try another."));});
    el.addEventListener("gmp-placeselect",e=>{if(e.place)take(e.place).catch(()=>{});});
  }catch(e){holder.dataset.ready="";}
}
function pinLine(prefix,lat,lng,addr){
  const has=lat!=null&&lat!==""&&lng!=null&&lng!=="";
  return `<div class="pin" id="${prefix}-pin">${has?`<span class="pill ok">GPS pinned</span><span class="small"><b>${esc((+lat).toFixed(5))}, ${esc((+lng).toFixed(5))}</b>${addr?" · "+esc(addr):""}</span><a class="link small" href="https://www.google.com/maps?q=${+lat},${+lng}" target="_blank" rel="noopener">View on map</a>`:`<span class="pill">No GPS pin yet</span><span class="small muted">${S.mapsKey?"Pick the address from the suggestions to pin it.":"Use your location on site, or enter coordinates."}</span>`}</div>`;
}
function locBlock(prefix,addr,lat,lng,inputHtml){
  const manual=!S.mapsKey||S.manualGps[prefix];
  return `<div class="locbox"><div class="f"><span>Site address</span><div id="${prefix}-ac" class="ac-holder">${inputHtml}</div></div>
    ${pinLine(prefix,lat,lng)}
    <div class="actions"><button type="button" class="btn sm" data-act="use-here" data-for="${prefix}">Use my current location</button>${S.mapsKey?`<button type="button" class="link small" data-act="manual-gps" data-for="${prefix}">${manual?"Hide coordinates":"Enter coordinates instead"}</button>`:""}</div>
    <div id="${prefix}-manual" ${manual?"":"hidden"}></div></div>`;
}
async function useHere(prefix){
  toast("Getting your location…");
  const d=await getDevicePos();
  if(!d){toast("Couldn't get your location. Allow location access in your browser and try again.");return;}
  if(d.acc>150)toast(`Location found (accurate to about ${Math.round(d.acc)} m). For a better pin, try again outdoors.`);
  setPin(prefix,{lat:+d.lat.toFixed(6),lng:+d.lng.toFixed(6)});
}
function setPin(prefix,pick){
  if(prefix==="o"){const d=S.onb.d;if(pick.address)d.loc=pick.address;d.gps=pick.lat+", "+pick.lng;render();return;}
  if(pick.address)S.pfLoc=pick.address;
  const g=document.getElementById("pf-gps");if(g)g.value=pick.lat+", "+pick.lng;
  const pl=document.getElementById("pf-pin");if(pl)pl.outerHTML=pinLine("pf",pick.lat,pick.lng,pick.address||"");
}


/* ---------- start ---------- */
(function(){const h=location.hash.slice(1);if(["home","signin","signup","demo","developer","engineer","investor","privacy","terms","admin","guide"].includes(h))S.view=h;})();
render();
(async function init(){
  const C=window.claude;
  if(!C||typeof C.use!=="function"){if(await initCf())return;previewSeed();S.mode="memory";pickProject();render();return;}
  let db=null;try{db=await C.use("db");}catch(e){}
  try{S.downloads=await C.use("downloads");}catch(e){}
  if(!db){previewSeed();S.mode="memory";pickProject();render();return;}
  S.db=db;S.mode="db";
  try{const u=await C.use("user");if(u&&typeof u.can==="function"){const c=await u.can("data.write");if(c===false)S.canWrite=false;}}catch(e){}
  try{S.assets=await C.use("assets");}catch(e){}
  const timer=setTimeout(()=>{if(!S.loaded.projects){S.slow=true;render();}},10000);
  subscribe("projects",db.collection("projects"));
  subscribe("logs",db.collection("logs").orderBy("createdAt","desc").limit(500));
  subscribe("reports",db.collection("reports"));
  subscribe("updates",db.collection("updates"));
  subscribe("expenses",db.collection("expenses"));
  subscribe("requests",db.collection("requests"));
  subscribe("matreqs",db.collection("matreqs"));
  subscribe("stock",db.collection("stock"));
  subscribe("milestones",db.collection("milestones"));
  setTimeout(flushOutbox,2500);
  const chk=setInterval(()=>{if(S.loaded.projects){S.slow=false;clearTimeout(timer);clearInterval(chk);render();}},300);
})();
})();
</script>
